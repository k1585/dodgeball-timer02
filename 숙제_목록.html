<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숙제 목록</title>
<style>
  :root{
    /* 포인트 색상: 이 값만 바꾸면 전체 화면의 파란색이 한 번에 바뀝니다 */
    --point-strong:#3F6FF5;  /* 진한 포인트컬러 */
    --point-light:#E6ECFF;   /* 연한 포인트컬러 */
  }

  *{
    box-sizing:border-box;
  }

  html, body{
    height:100%;
    margin:0;
  }

  body{
    background:#ffffff;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;
    justify-content:center;
  }

  .screen{
    width:100%;
    max-width:480px;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:24px 20px 0;
  }

  /* 1: 페이지 제목 (환영 문구 자리) */
  .page-title{
    font-size:28px;
    font-weight:800;
    color:#111111;
    margin:0;
    flex-shrink:0;
  }

  /* 3,4: 세부 목록(탭) */
  .tabs{
    display:flex;
    margin-top:18px;
    border-bottom:1px solid #eeeeee;
    flex-shrink:0;
  }

  .tab{
    flex:1;
    background:none;
    border:none;
    padding:12px 0;
    font-size:16px;
    font-weight:700;
    color:#9aa0a6;
    border-bottom:3px solid transparent;
    margin-bottom:-1px;
    cursor:pointer;
  }

  .tab.active{
    color:var(--point-strong);
    border-bottom-color:var(--point-strong);
  }

  /* 5: 날짜 범위 */
  .date-range{
    color:var(--point-strong);
    font-size:16px;
    font-weight:800;
    margin:18px 0 12px;
    flex-shrink:0;
  }

  /* 스크롤되는 숙제 목록 영역 */
  .list-area{
    flex:1;
    overflow-y:auto;
    padding-bottom:100px;
  }

  /* 6: 숙제 카드 */
  .hw-card{
    border:1px solid #ececec;
    border-radius:16px;
    padding:18px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }

  .subject-badge{
    display:inline-block;
    background:var(--point-light);
    color:var(--point-strong);
    font-size:13px;
    font-weight:800;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }

  .hw-name{
    font-size:20px;
    font-weight:800;
    color:#111111;
    margin:0 0 6px;
  }

  .hw-due{
    font-size:13px;
    color:#888888;
  }

  .hw-right{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
  }

  .hw-dday{
    background:var(--point-light);
    color:var(--point-strong);
    font-weight:800;
    font-size:15px;
    padding:7px 14px;
    border-radius:999px;
    white-space:nowrap;
  }

  .hw-arrow{
    color:#c2c2c2;
  }

  /* 7: 오늘/이후 숙제 구분선 */
  .section-divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:#9aa0a6;
    font-size:13px;
    font-weight:700;
    margin:20px 0 14px;
    white-space:nowrap;
  }

  .section-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e5e5e5;
  }

  /* 하단 고정 메뉴 (홈 화면과 동일하게 유지) */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:#ffffff;
    border-top:1px solid #eeeeee;
    display:flex;
    z-index:50;
  }

  .nav-item{
    flex:1;
    background:none;
    border:none;
    padding:10px 0 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:#9aa0a6;
    font-size:11px;
    font-weight:700;
    letter-spacing:-0.3px;
    cursor:pointer;
  }

  .nav-item.active{
    color:var(--point-strong);
  }
</style>
</head>
