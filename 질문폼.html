<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SNS 심리분석</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --grad: linear-gradient(135deg, #7b2ff7 0%, #d62976 50%, #4f5bd5 100%);
    --glow: #a855f7;
    --pink: #d62976;
    --purple: #a855f7;
    --text: #ece9f5;
    --sub: #8a85a0;
    --line: #2a2740;
    --bg: #09080f;
    --card: #14121f;
    --field: #1c1930;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text);
    background-image: radial-gradient(circle at 20% 0%, rgba(123,47,247,.18), transparent 45%),
                      radial-gradient(circle at 85% 20%, rgba(214,41,118,.14), transparent 40%);
    background-attachment: fixed;
  }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }

  /* 상단 헤더 */
  .hero {
    text-align: center; padding: 48px 16px 60px; position: relative;
  }
  .logo {
    width: 92px; height: 92px; margin: 0 auto 18px; border-radius: 50%;
    background: var(--grad); display: flex; align-items: center; justify-content: center;
    font-size: 44px; box-shadow: 0 0 40px rgba(168,85,247,.55);
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .badge {
    display: inline-block; background: rgba(168,85,247,.15); border: 1px solid rgba(168,85,247,.4);
    color: #d9b8ff; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px;
  }
  .hero h1 {
    margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.5px; white-space: pre-wrap;
    background: linear-gradient(135deg, #e9d5ff, #f0abfc, #a5b4fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(168,85,247,.3);
  }
  .hero p { margin: 10px 0 0; font-size: 14px; color: var(--sub); white-space: pre-wrap; }
  .count { margin-top: 16px; font-size: 13px; font-weight: 500; color: var(--sub); }
  .count b { font-weight: 900; color: var(--purple); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    margin-top: -24px; padding: 26px 20px; position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  label.q { display: block; font-weight: 700; font-size: 16px; margin: 0 0 8px; white-space: pre-wrap; }
  label.q + .field-box { margin-bottom: 20px; }
  .field-box {
    border-radius: 14px; padding: 1.5px; background: var(--line);
    transition: background .2s, box-shadow .2s;
  }
  .field-box:focus-within { background: var(--grad); box-shadow: 0 0 18px rgba(168,85,247,.35); }
  textarea, .field-box input {
    display: block; width: 100%; border: none; border-radius: 12px; padding: 13px 14px;
    font-size: 15px; font-family: inherit; resize: none; background: var(--field); color: var(--text);
    min-height: 54px;
  }
  textarea:focus, .field-box input:focus { outline: none; }
  textarea::placeholder, .field-box input::placeholder { color: #5a5570; }
  .field-box input[type=password] { letter-spacing: 3px; }
  .field-box input[type=password]::placeholder { letter-spacing: normal; }
  /* 눈 아이콘 토글 입력칸 */
  .pw { position: relative; }
  .pw input { padding-right: 48px; }
  .pw .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 38px; height: 38px; min-height: 0; padding: 0; margin: 0;
    background: transparent; border-radius: 10px; font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center; color: var(--sub);
  }
  .pw .eye:active { background: rgba(168,85,247,.15); }

  .agree {
    margin-top: 6px; padding: 14px; background: var(--field); border: 1px solid var(--line);
    border-radius: 12px; font-size: 12px; color: var(--sub); line-height: 1.6;
  }
  .agree > div { white-space: pre-wrap; }
  .agree label {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
    font-weight: 700; color: var(--text); font-size: 13px; white-space: normal;
  }
  .agree input { width: 18px; height: 18px; accent-color: var(--purple); flex-shrink: 0; }

  button {
    border: none; border-radius: 30px; padding: 15px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; color: #fff;
  }
  .primary {
    width: 100%; margin-top: 20px; background: var(--grad);
    box-shadow: 0 6px 24px rgba(168,85,247,.4);
  }
  .primary:disabled { opacity: .4; box-shadow: none; cursor: not-allowed; }
  .secondary { background: #262238; color: var(--text); }
  .footer { text-align: center; font-size: 11px; color: #4f4a63; margin-top: 24px; white-space: pre-wrap; line-height: 1.6; }

  /* 팝업 */
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 30px 22px 22px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 0 50px rgba(168,85,247,.25);
  }
  .modal .mico { font-size: 40px; margin-bottom: 10px; }
  .modal h3 { margin: 0 0 10px; font-size: 19px; white-space: pre-wrap; }
  .modal .ask { margin: 0 0 4px; color: var(--sub); font-size: 14px; white-space: pre-wrap; line-height: 1.6; }
  .modal .btns { display: flex; gap: 8px; margin-top: 20px; }
  .modal .btns button { flex: 1; }
  .modal .btns .primary { margin-top: 0; }

  /* 로딩 */
  #loading .wrap { position: relative; }
  #backHome {
    position: absolute; top: 16px; left: 4px; width: auto; margin: 0;
    background: transparent; color: var(--sub); font-size: 15px; font-weight: 500;
    padding: 8px 10px; display: flex; align-items: center; gap: 4px; z-index: 2;
  }
  #backHome:active { color: var(--text); }
  #loading .wrap {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; text-align: center; padding-top: 32vh;
  }
  #loadTitle {
    font-size: 24px; font-weight: 900; margin: 0 0 36px; white-space: pre-wrap;
    background: linear-gradient(135deg, #e9d5ff, #f0abfc, #a5b4fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(168,85,247,.3);
  }
  .spinner {
    width: 90px; height: 90px; border-radius: 50%;
    background: conic-gradient(from 0deg, #7b2ff7, #d62976, #4f5bd5, #a855f7, rgba(123,47,247,0));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 7px));
    animation: spin 1s linear infinite;
    filter: drop-shadow(0 0 12px rgba(168,85,247,.6));
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadSub { font-size: 15px; color: var(--sub); margin: 32px 0 0; white-space: pre-wrap; }
  #loadWarn {
    margin-top: auto; padding: 40px 0 10px; font-size: 12px; color: #4f4a63; line-height: 1.7; white-space: pre-wrap;
  }

  /* 관리자 */
  #admin .wrap { padding-top: 20px; }
  #admin .card { margin-top: 0; }
  #admin h2 { margin: 0 0 4px; }
  #admin h4 { margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--purple); }
  #admin .af { margin-bottom: 12px; }
  #admin .af span { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  #admin .af textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; min-height: 44px;
    font-size: 14px; padding: 10px; background: var(--field); color: var(--text);
    font-family: inherit; resize: none;
  }
  #admin .af textarea:focus { outline: none; border-color: var(--purple); }

  .resp { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
  .resp .t { font-size: 11px; color: var(--sub); margin-bottom: 6px; }
  .resp p { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  .danger { background: #3a1620; color: #ff8097; }
  .sticky-save {
    position: sticky; bottom: 0; background: var(--card); padding: 12px 0 4px; margin-top: 10px;
  }
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(40,36,60,.95); border: 1px solid var(--line); color: #fff;
    padding: 10px 18px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 20; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 1. 질문 화면 -->
<section id="form" class="screen active">
  <div class="hero">
    <div class="logo" data-t="logo"></div>
    <div class="badge" data-t="badge"></div>
    <h1 data-t="heroTitle"></h1>
    <p data-t="heroSub"></p>
    <div class="count"><span data-t="countPre"></span> <b data-t="countNum"></b><span data-t="countPost"></span></div>
  </div>
  <div class="wrap">
    <div class="card">
      <label class="q" data-t="q1"></label>
      <div class="field-box"><textarea id="a1" rows="1"></textarea></div>

      <label class="q" data-t="q2"></label>
      <div class="field-box"><div class="pw">
        <input type="text" id="a2" autocomplete="off">
        <button type="button" class="eye" id="a2eye" aria-label="보이기">👁️</button>
      </div></div>

      <div class="agree">
        <div data-t="agreeText"></div>
        <label><input type="checkbox" id="agreeChk"> <span data-t="agreeLabel"></span></label>
      </div>

      <button class="primary" id="submitBtn" disabled data-t="submitBtn"></button>
    </div>
    <div class="footer" data-t="footer"></div>
  </div>
</section>

<!-- 2. 확인 팝업 (대답은 표시하지 않음) -->
<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <div class="mico" data-t="modalIcon"></div>
    <h3 data-t="modalTitle"></h3>
    <p class="ask" data-t="modalAsk"></p>
    <div class="btns">
      <button class="secondary" id="backBtn" data-t="modalBack"></button>
      <button class="primary" id="okBtn" data-t="modalOk"></button>
    </div>
  </div>
</div>

<!-- 3. 로딩 화면 -->
<section id="loading" class="screen">
  <div class="wrap">
    <button id="backHome">← <span data-t="backHome"></span></button>
    <h1 id="loadTitle" data-t="loadTitle"></h1>
    <div class="spinner"></div>
    <p id="loadSub" data-t="loadSub"></p>
    <div id="loadWarn" data-t="loadWarn"></div>
  </div>
</section>

<!-- 4. 관리자 모드 -->
<section id="admin" class="screen">
  <div class="wrap">
    <div class="card">
      <h2>🔧 관리자 모드</h2>
      <div id="adminFields"></div>

      <div class="sticky-save row">
        <button class="secondary" id="resetBtn">기본값으로</button>
        <button class="primary" id="saveBtn" style="margin-top:0">저장</button>
      </div>

      <h4>받은 대답 (<span id="respCount">0</span>)</h4>
      <div id="respList"></div>
      <div class="row" style="margin-top:8px">
        <button class="danger" id="clearBtn">대답 전체 삭제</button>
      </div>

      <button class="primary" id="exitBtn">일반 모드로 돌아가기</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
// [그룹, 키, 관리자 화면 이름, 기본값]
const SCHEMA = [
  ["기본", "pageTitle", "브라우저 탭 제목", "SNS 심리분석"],
  ["상단", "logo", "로고 (이모지/글자)", "🔮"],
  ["상단", "badge", "작은 뱃지", "✨ AI 심리분석"],
  ["상단", "heroTitle", "큰 제목", "인스타 심리분석"],
  ["상단", "heroSub", "제목 아래 설명", "아이디만 입력하면\nAI가 당신의 성향을 분석해드려요"],
  ["상단", "countPre", "참여자 수 앞 문구", "지금까지"],
  ["상단", "countNum", "참여자 수", "1,284,392명"],
  ["상단", "countPost", "참여자 수 뒤 문구", "이 분석했어요"],
  ["질문", "q1", "질문 1", "분석할 인스타그램 아이디"],
  ["질문", "p1", "질문 1 답장란 도움말", "@ 없이 아이디를 입력해주세요"],
  ["질문", "q2", "질문 2", "요즘 가장 큰 고민은?"],
  ["질문", "p2", "질문 2 답장란 도움말", "자유롭게 적어주세요 (분석 정확도가 올라가요)"],
  ["질문", "emptyToast", "빈칸일 때 알림", "모든 항목을 입력해주세요"],
  ["동의", "agreeText", "정보 수집 동의 안내문", "[개인정보 수집 및 이용 동의]\n· 수집 항목: 입력하신 아이디 및 답변\n· 이용 목적: 심리분석 결과 제공\n· 보유 기간: 분석 완료 후 즉시 파기"],
  ["동의", "agreeLabel", "동의 체크 문구", "위 내용에 동의합니다 (필수)"],
  ["동의", "submitBtn", "제출 버튼", "분석 시작하기"],
  ["동의", "footer", "맨 아래 작은 글씨", "본 서비스는 재미로 즐기는 콘텐츠입니다.\n© 2026 SNS 심리분석"],
  ["팝업", "modalIcon", "팝업 아이콘 (이모지)", "🔮"],
  ["팝업", "modalTitle", "팝업 제목", "제출 전 확인"],
  ["팝업", "modalAsk", "팝업 확인 문구", "정확하게 입력하셨나요?\n제출하면 수정할 수 없어요."],
  ["팝업", "modalBack", "수정 버튼", "다시 확인"],
  ["팝업", "modalOk", "확인 버튼", "네, 제출할게요"],
  ["로딩", "loadTitle", "위쪽 글자 (제목)", "심리 분석 중..."],
  ["로딩", "loadSub", "아래쪽 글자 (소제목)", "게시물과 활동 패턴을 분석하고 있어요"],
  ["로딩", "loadWarn", "맨 아래 경고 문구 (본문)", "※ 분석에는 최대 1~2분이 소요될 수 있습니다.\n이 화면을 닫거나 새로고침하면 분석이 취소됩니다."],
  ["로딩", "backHome", "뒤로가기(나가기) 버튼", "나가기"],
];
const DEFAULTS = Object.fromEntries(SCHEMA.map(s => [s[1], s[3]]));

const CFG_KEY = "qform_config", RESP_KEY = "qform_responses";
const $ = id => document.getElementById(id);

function load(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
}
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
let cfg = { ...DEFAULTS, ...load(CFG_KEY, {}) };

function applyConfig() {
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = cfg[el.dataset.t]);
  document.title = cfg.pageTitle;
  $("a1").placeholder = cfg.p1;
  $("a2").placeholder = cfg.p2;
}

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

// 답장란 자동 높이
document.querySelectorAll("textarea").forEach(autoGrow);
function autoGrow(ta) {
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; });
}

// 질문2: 글자 작성 후 적정 시간 뒤 자동 마스킹 + 눈 아이콘으로 보이기/가리기
const A2_MASK_DELAY = 1500; // ms
let a2timer, a2masked = false;
function setA2Mask(m) {
  a2masked = m;
  $("a2").type = m ? "password" : "text";
  $("a2eye").textContent = m ? "👁️" : "🙈";
  $("a2eye").setAttribute("aria-label", m ? "보이기" : "가리기");
}
$("a2").addEventListener("input", () => {
  setA2Mask(false);               // 입력 중에는 보이게
  clearTimeout(a2timer);
  a2timer = setTimeout(() => setA2Mask(true), A2_MASK_DELAY); // 잠시 뒤 가리기
});
$("a2eye").addEventListener("click", () => {
  clearTimeout(a2timer);
  setA2Mask(!a2masked);           // 눈 아이콘으로 토글
});
setA2Mask(false);

// 제출 흐름 — 확인창에는 대답을 표시하지 않음
$("agreeChk").addEventListener("change", e => $("submitBtn").disabled = !e.target.checked);
$("submitBtn").addEventListener("click", () => {
  const a1 = $("a1").value.trim(), a2 = $("a2").value.trim();
  if (!a1 || !a2) { toast(cfg.emptyToast); return; }
  $("confirmModal").classList.add("show");
});
$("backBtn").addEventListener("click", () => $("confirmModal").classList.remove("show"));
$("okBtn").addEventListener("click", () => {
  const list = load(RESP_KEY, []);
  list.push({ time: new Date().toLocaleString("ko-KR"), q1: cfg.q1, a1: $("a1").value.trim(), q2: cfg.q2, a2: $("a2").value.trim() });
  store(RESP_KEY, list);
  $("confirmModal").classList.remove("show");
  show("loading"); // 동글뱅이 계속 돌아감
});

// 질문1 답장란 5번 연속 탭 → 관리자 모드
let taps = 0, tapTimer;
$("a1").addEventListener("click", () => {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => taps = 0, 800);
  if (taps >= 5) { taps = 0; $("a1").blur(); openAdmin(); }
});

// 관리자 모드: 스키마로 입력칸 자동 생성
(function buildAdmin() {
  const box = $("adminFields");
  let group = "";
  SCHEMA.forEach(([g, key, name]) => {
    if (g !== group) {
      group = g;
      const h = document.createElement("h4"); h.textContent = g; box.appendChild(h);
    }
    const f = document.createElement("div"); f.className = "af";
    const s = document.createElement("span"); s.textContent = name;
    const ta = document.createElement("textarea"); ta.dataset.key = key; ta.rows = 1;
    autoGrow(ta);
    f.append(s, ta); box.appendChild(f);
  });
})();

function openAdmin() {
  show("admin");
  document.querySelectorAll("#adminFields [data-key]").forEach(el => {
    el.value = cfg[el.dataset.key];
    el.style.height = "auto"; el.style.height = el.scrollHeight + "px";
  });
  renderResponses();
}

function renderResponses() {
  const list = load(RESP_KEY, []);
  $("respCount").textContent = list.length;
  const box = $("respList");
  box.innerHTML = "";
  if (!list.length) { box.innerHTML = '<p style="color:#8a85a0;font-size:14px">아직 받은 대답이 없어요.</p>'; return; }
  list.slice().reverse().forEach(r => {
    const d = document.createElement("div");
    d.className = "resp";
    const t = document.createElement("div"); t.className = "t"; t.textContent = r.time;
    const p1 = document.createElement("p"); p1.textContent = `${r.q1}: ${r.a1}`;
    const p2 = document.createElement("p"); p2.textContent = `${r.q2}: ${r.a2}`;
    d.append(t, p1, p2);
    box.appendChild(d);
  });
}

$("saveBtn").addEventListener("click", () => {
  document.querySelectorAll("#adminFields [data-key]").forEach(el => cfg[el.dataset.key] = el.value);
  store(CFG_KEY, cfg); applyConfig(); renderResponses(); toast("저장했어요");
});
$("resetBtn").addEventListener("click", () => {
  if (!confirm("모든 설정을 기본값으로 되돌릴까요?")) return;
  cfg = { ...DEFAULTS }; store(CFG_KEY, cfg); applyConfig(); openAdmin(); toast("기본값으로 되돌렸어요");
});
$("clearBtn").addEventListener("click", () => {
  if (!confirm("받은 대답을 모두 삭제할까요?")) return;
  store(RESP_KEY, []); renderResponses();
});
$("exitBtn").addEventListener("click", () => {
  $("a1").value = ""; $("a2").value = ""; $("agreeChk").checked = false; $("submitBtn").disabled = true;
  show("form");
});

// 로딩 화면 나가기 → 첫 화면으로 (입력값 초기화)
$("backHome").addEventListener("click", () => {
  $("a1").value = ""; $("a2").value = ""; $("agreeChk").checked = false; $("submitBtn").disabled = true;
  show("form");
});

applyConfig();
</script>
</body>
</html>
