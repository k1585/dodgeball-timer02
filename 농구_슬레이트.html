<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>농구 슬레이트</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:#111;
    font-family:'Arial Black','Arial',sans-serif;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  #stage{
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #board{
    background:#fff;
    width:min(100vw, 141.4vh);
    height:min(70.75vw, 100vh);
    aspect-ratio:1494/1058;
    display:flex;
    flex-direction:column;
    border:6px solid #000;
    overflow:hidden;
  }
  /* header */
  #header{
    background:#000;
    color:#fff;
    text-align:center;
    padding:1.6% 2% 1%;
    flex:0 0 auto;
  }
  #header .title{
    font-size:5.2vw;
    letter-spacing:2px;
    line-height:1;
    font-style:italic;
    transform:scaleY(1.15);
    margin:0;
    -webkit-text-stroke:0;
  }
  #header .subtitle{
    font-size:1.5vw;
    letter-spacing:8px;
    font-style:italic;
    margin-top:.6vw;
    font-family:Arial,sans-serif;
    font-weight:bold;
  }
  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }
  /* left info column */
  #left{
    flex:1 1 55%;
    display:flex;
    flex-direction:column;
  }
  .row{
    flex:1 1 auto;
    display:flex;
    border-bottom:3px solid #000;
    min-height:0;
  }
  .row:last-child{border-bottom:none;}
  .label{
    flex:0 0 32%;
    background:#000;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-left:2%;
  }
  .label .kr{
    font-size:1.9vw;
    line-height:1.1;
  }
  .label .en{
    font-size:1.05vw;
    font-style:italic;
    font-family:Arial,sans-serif;
    font-weight:bold;
    letter-spacing:1px;
    margin-top:2px;
  }
  .value{
    flex:1 1 auto;
    border-left:3px solid #000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:2vw;
    color:#111;
    padding:0 2%;
    text-align:center;
    user-select:none;
  }
  .value.placeholder{color:#bbb;font-weight:normal;font-style:italic;font-size:1.4vw;}
  .value:active{background:#f0f0f0;}

  /* game number boxes */
  .gameno-boxes{
    display:flex;
    gap:1.2%;
    justify-content:center;
    align-items:center;
    width:100%;
    height:70%;
  }
  .gameno-boxes .digit{
    flex:0 0 14%;
    height:100%;
    border:3px solid #000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.4vw;
    font-family:Arial,sans-serif;
    font-weight:bold;
  }

  /* date / time blanks */
  .blank-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1%;
    width:100%;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:1.9vw;
  }
  .blank{
    border-bottom:3px solid #000;
    min-width:18%;
    text-align:center;
    padding-bottom:2px;
  }
  .dot{font-size:1.6vw;}

  /* right column */
  #right{
    flex:1 1 45%;
    display:flex;
    flex-direction:column;
    border-left:6px solid #000;
  }
  .team-tag{
    background:#000;
    color:#fff;
    flex:0 0 auto;
    padding:1% 3%;
    font-size:2.6vw;
    line-height:1;
  }
  .team-tag .sub{
    font-family:Arial,sans-serif;
    font-size:1.4vw;
    font-style:italic;
    margin-left:.6vw;
  }
  .team-name{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    border-bottom:3px solid #000;
    cursor:pointer;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:2.6vw;
    user-select:none;
  }
  .team-name.placeholder{color:#bbb;font-weight:normal;font-style:italic;font-size:1.6vw;}
  .team-name:active{background:#f0f0f0;}
  .vs{
    flex:0 0 auto;
    text-align:center;
    padding:2% 0;
    font-size:5vw;
    font-style:italic;
    line-height:1;
  }
  #scores{
    flex:0 0 30%;
    display:flex;
    border-top:6px solid #000;
  }
  .score-col{
    flex:1 1 50%;
    display:flex;
    flex-direction:column;
  }
  .score-col:first-child{border-right:3px solid #000;}
  .score-head{
    background:#000;
    color:#fff;
    text-align:center;
    padding:3% 0;
    font-size:1.7vw;
    flex:0 0 auto;
  }
  .score-val{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:3.6vw;
    cursor:pointer;
    user-select:none;
  }
  .score-val:active{background:#f0f0f0;}

  #footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:1.5%;
    padding:1% 0;
    border-top:3px solid #000;
    font-family:Arial,sans-serif;
    font-weight:bold;
    font-size:1.4vw;
  }
  #footer .sep{color:#999;}
  #footer .icon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.8vw;
    height:1.8vw;
    border-radius:50%;
    border:2px solid #000;
  }
  #footer .icon svg{width:70%;height:70%;}
  #footer .yticon{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:1.8vw;
    height:1.8vw;
    border-radius:4px;
    background:#000;
  }
  #footer .yticon svg{width:60%;height:60%;fill:#fff;}
  #footer .grp{display:inline-flex;align-items:center;gap:.5vw;}

  /* modal */
  #overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
  }
  #overlay.show{display:flex;}
  #modal{
    background:#fff;
    border-radius:12px;
    width:min(90vw,480px);
    padding:24px;
    font-family:Arial,sans-serif;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  #modal h3{
    margin:0 0 16px;
    font-size:20px;
    color:#111;
  }
  #modal input[type=text],
  #modal input[type=number],
  #modal input[type=date],
  #modal input[type=time]{
    width:100%;
    font-size:20px;
    padding:12px;
    border:2px solid #333;
    border-radius:8px;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
  }
  #gameno-inputs{
    display:flex;
    gap:8px;
  }
  #gameno-inputs input{
    width:20%;
    text-align:center;
    font-size:24px;
    padding:12px 0;
    border:2px solid #333;
    border-radius:8px;
  }
  #modal .btns{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  #modal button{
    flex:1;
    padding:14px 0;
    font-size:17px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    cursor:pointer;
  }
  #btn-save{background:#111;color:#fff;}
  #btn-cancel{background:#e2e2e2;color:#111;}
  #btn-clear{background:#fff;color:#c00;border:2px solid #c00;flex:0 0 auto;padding:14px 16px;}
</style>
</head>
<body>

<div id="stage">
  <div id="board">

    <div id="header">
      <div class="title">BASKETBALL</div>
      <div class="subtitle">KOREA SPORTS ACADEMY</div>
    </div>

    <div id="main">
      <div id="left">
        <div class="row">
          <div class="label"><div class="kr">대회명</div><div class="en">TOURNAMENT</div></div>
          <div class="value placeholder" data-field="tournament" data-type="text" data-title="대회명 입력">터치하여 입력</div>
        </div>
        <div class="row">
          <div class="label"><div class="kr">경기명</div><div class="en">GAME TITLE</div></div>
          <div class="value placeholder" data-field="gameTitle" data-type="text" data-title="경기명 입력">터치하여 입력</div>
        </div>
        <div class="row">
          <div class="label"><div class="kr">경기고유번호</div><div class="en">GAME NO.</div></div>
          <div class="value" data-field="gameNo" data-type="gameno" data-title="경기고유번호 입력 (5자리)">
            <div class="gameno-boxes" id="gameno-display">
              <div class="digit"></div><div class="digit"></div><div class="digit"></div><div class="digit"></div><div class="digit"></div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="label"><div class="kr">날짜</div><div class="en">DATE</div></div>
          <div class="value" data-field="date" data-type="date" data-title="날짜 선택">
            <div class="blank-row" id="date-display">
              <span class="blank">&nbsp;</span><span class="dot">.</span>
              <span class="blank">&nbsp;</span><span class="dot">.</span>
              <span class="blank">&nbsp;</span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="label"><div class="kr">경기 시작시간</div><div class="en">START TIME</div></div>
          <div class="value" data-field="startTime" data-type="time" data-title="경기 시작시간 선택">
            <div class="blank-row" id="time-display">
              <span class="blank">&nbsp;</span><span class="dot">:</span><span class="blank">&nbsp;</span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="label"><div class="kr">촬영 카메라</div><div class="en">CAMERA</div></div>
          <div class="value placeholder" data-field="camera" data-type="text" data-title="촬영 카메라 입력">터치하여 입력</div>
        </div>
      </div>

      <div id="right">
        <div class="team-tag"><span class="kr">HOME</span> <span class="sub">TEAM</span></div>
        <div class="team-name placeholder" data-field="homeTeam" data-type="text" data-title="HOME 팀명 입력">터치하여 입력</div>
        <div class="vs">VS</div>
        <div class="team-tag"><span class="kr">AWAY</span> <span class="sub">TEAM</span></div>
        <div class="team-name placeholder" data-field="awayTeam" data-type="text" data-title="AWAY 팀명 입력">터치하여 입력</div>

        <div id="scores">
          <div class="score-col">
            <div class="score-head">HOME SCORE</div>
            <div class="score-val" data-field="homeScore" data-type="number" data-title="HOME 점수 입력">0</div>
          </div>
          <div class="score-col">
            <div class="score-head">AWAY SCORE</div>
            <div class="score-val" data-field="awayScore" data-type="number" data-title="AWAY 점수 입력">0</div>
          </div>
        </div>
      </div>
    </div>

    <div id="footer">
      <span class="grp">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></span>
        <span>@yangju_korea_sports</span>
      </span>
      <span class="sep">|</span>
      <span class="grp">
        <span class="yticon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        <span>양주 고려대스포츠아카데미</span>
      </span>
    </div>

  </div>
</div>

<div id="overlay">
  <div id="modal">
    <h3 id="modal-title">입력</h3>
    <div id="modal-body"></div>
    <div class="btns">
      <button id="btn-clear">지우기</button>
      <button id="btn-cancel">취소</button>
      <button id="btn-save">저장</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "basketballSlateData";
const defaults = {
  tournament:"", gameTitle:"", gameNo:"", date:"", startTime:"",
  camera:"", homeTeam:"", awayTeam:"", homeScore:0, awayScore:0
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? Object.assign({}, defaults, JSON.parse(raw)) : Object.assign({}, defaults);
  }catch(e){ return Object.assign({}, defaults); }
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();

function render(){
  setText("tournament", data.tournament, "터치하여 입력");
  setText("gameTitle", data.gameTitle, "터치하여 입력");
  setText("camera", data.camera, "터치하여 입력");
  setText("homeTeam", data.homeTeam, "터치하여 입력");
  setText("awayTeam", data.awayTeam, "터치하여 입력");

  document.querySelector('.score-val[data-field="homeScore"]').textContent = data.homeScore ?? 0;
  document.querySelector('.score-val[data-field="awayScore"]').textContent = data.awayScore ?? 0;

  const digits = String(data.gameNo || "").padEnd(5," ").split("");
  document.querySelectorAll("#gameno-display .digit").forEach((el,i)=>{
    el.textContent = digits[i] && digits[i] !== " " ? digits[i] : "";
  });

  const dateDisplay = document.getElementById("date-display");
  if(data.date){
    const [y,m,d] = data.date.split("-");
    dateDisplay.innerHTML = `<span class="blank">${y}</span><span class="dot">.</span><span class="blank">${m}</span><span class="dot">.</span><span class="blank">${d}</span>`;
  }else{
    dateDisplay.innerHTML = `<span class="blank">&nbsp;</span><span class="dot">.</span><span class="blank">&nbsp;</span><span class="dot">.</span><span class="blank">&nbsp;</span>`;
  }

  const timeDisplay = document.getElementById("time-display");
  if(data.startTime){
    const [h,m] = data.startTime.split(":");
    timeDisplay.innerHTML = `<span class="blank">${h}</span><span class="dot">:</span><span class="blank">${m}</span>`;
  }else{
    timeDisplay.innerHTML = `<span class="blank">&nbsp;</span><span class="dot">:</span><span class="blank">&nbsp;</span>`;
  }
}

function setText(field, value, placeholder){
  const el = document.querySelector(`.value[data-field="${field}"], .team-name[data-field="${field}"]`);
  if(!el) return;
  if(value){
    el.textContent = value;
    el.classList.remove("placeholder");
  }else{
    el.textContent = placeholder;
    el.classList.add("placeholder");
  }
}

const overlay = document.getElementById("overlay");
const modalTitle = document.getElementById("modal-title");
const modalBody = document.getElementById("modal-body");
const btnSave = document.getElementById("btn-save");
const btnCancel = document.getElementById("btn-cancel");
const btnClear = document.getElementById("btn-clear");

let currentField = null;
let currentType = null;

function openModal(field, type, title){
  currentField = field;
  currentType = type;
  modalTitle.textContent = title;
  modalBody.innerHTML = "";

  if(type === "text"){
    modalBody.innerHTML = `<input type="text" id="input-val" maxlength="40" autocomplete="off">`;
    document.getElementById("input-val").value = data[field] || "";
  }else if(type === "number"){
    modalBody.innerHTML = `<input type="number" id="input-val" inputmode="numeric" min="0" max="999">`;
    document.getElementById("input-val").value = data[field] ?? 0;
  }else if(type === "date"){
    modalBody.innerHTML = `<input type="date" id="input-val">`;
    document.getElementById("input-val").value = data[field] || "";
  }else if(type === "time"){
    modalBody.innerHTML = `<input type="time" id="input-val">`;
    document.getElementById("input-val").value = data[field] || "";
  }else if(type === "gameno"){
    modalBody.innerHTML = `<div id="gameno-inputs">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
      <input type="text" maxlength="1" inputmode="numeric">
    </div>`;
    const inputs = modalBody.querySelectorAll("input");
    const cur = String(data.gameNo || "").split("");
    inputs.forEach((inp,i)=>{
      inp.value = cur[i] || "";
      inp.addEventListener("input", ()=>{
        inp.value = inp.value.replace(/[^0-9]/g,"");
        if(inp.value && i < inputs.length-1) inputs[i+1].focus();
      });
      inp.addEventListener("keydown", (e)=>{
        if(e.key === "Backspace" && !inp.value && i>0) inputs[i-1].focus();
      });
    });
  }

  overlay.classList.add("show");
  setTimeout(()=>{
    const first = modalBody.querySelector("input");
    if(first) first.focus();
  },50);
}

function closeModal(){
  overlay.classList.remove("show");
  currentField = null;
  currentType = null;
}

document.querySelectorAll("[data-field]").forEach(el=>{
  el.addEventListener("click", ()=>{
    const field = el.getAttribute("data-field");
    const type = el.getAttribute("data-type");
    const title = el.getAttribute("data-title");
    openModal(field, type, title);
  });
});

btnCancel.addEventListener("click", closeModal);
overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });

btnClear.addEventListener("click", ()=>{
  if(!currentField) return;
  if(currentType === "number"){
    data[currentField] = 0;
  }else{
    data[currentField] = "";
  }
  saveData(data);
  render();
  closeModal();
});

btnSave.addEventListener("click", ()=>{
  if(!currentField) return;

  if(currentType === "gameno"){
    const inputs = modalBody.querySelectorAll("input");
    let val = "";
    inputs.forEach(inp=> val += inp.value);
    data.gameNo = val;
  }else if(currentType === "number"){
    const v = document.getElementById("input-val").value;
    data[currentField] = v === "" ? 0 : Math.max(0, parseInt(v,10) || 0);
  }else{
    const v = document.getElementById("input-val").value;
    data[currentField] = v;
  }

  saveData(data);
  render();
  closeModal();
});

document.addEventListener("keydown",(e)=>{
  if(!overlay.classList.contains("show")) return;
  if(e.key === "Enter") btnSave.click();
  if(e.key === "Escape") closeModal();
});

render();
</script>
</body>
</html>
