<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>농구 경기 슬레이트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0c0c0e;
    font-family: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .headline {
    font-family: "Anton", "Malgun Gothic", Arial, sans-serif;
  }

  .page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #f2f2f0;
  }

  /* ---------- top controls ---------- */
  .top-controls {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 4px 6px;
    background: #000;
  }

  /* ---------- banner ---------- */
  .banner {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    background: linear-gradient(120deg, #dcdcda 0%, #eee 40%, #c9c9c7 100%);
    overflow: hidden;
  }

  .banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      115deg,
      rgba(255, 255, 255, 0.5) 0px,
      rgba(255, 255, 255, 0.5) 14px,
      rgba(0, 0, 0, 0.04) 14px,
      rgba(0, 0, 0, 0.04) 28px
    );
    pointer-events: none;
  }

  .banner-black {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    width: min(68%, 720px);
    background:
      repeating-linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.045) 0px,
        rgba(255, 255, 255, 0.045) 10px,
        transparent 10px,
        transparent 24px
      ),
      linear-gradient(100deg, #0a0a0b 60%, #232327 100%);
    clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
    padding: clamp(10px, 1.8vh, 24px) clamp(16px, 3vw, 40px) clamp(10px, 1.8vh, 24px) clamp(14px, 2vw, 28px);
    cursor: pointer;
  }

  .banner-title {
    color: #fff;
    font-size: clamp(28px, 5.4vw, 58px);
    font-style: italic;
    letter-spacing: 1px;
    line-height: 1;
    margin: 0;
    white-space: nowrap;
  }

  .banner-underline {
    width: 90%;
    height: 4px;
    background: #e2001a;
    margin: 6px 0 6px;
  }

  .banner-subtitle {
    color: #eee;
    font-size: clamp(11px, 1.6vw, 20px);
    letter-spacing: 6px;
    margin: 0;
    white-space: nowrap;
  }

  .hoop-wrap {
    position: absolute;
    right: clamp(4px, 2vw, 30px);
    top: clamp(-18px, -3vw, -6px);
    z-index: 1;
    width: clamp(90px, 12vw, 170px);
    height: clamp(90px, 12vw, 170px);
    cursor: pointer;
  }

  .hoop-wrap svg {
    width: 100%;
    height: 100%;
  }

  /* ---------- main content ---------- */
  .content {
    flex: 1 1 auto;
    display: flex;
    gap: clamp(6px, 1vw, 14px);
    padding: clamp(6px, 1vh, 14px);
    min-height: 0;
  }

  .left-panel {
    flex: 1.5;
    display: flex;
    flex-direction: column;
    gap: clamp(3px, 0.7vh, 8px);
    min-width: 0;
  }

  .row {
    flex: 1;
    display: flex;
    border: 2px solid #111;
    min-height: 0;
  }

  .row-label {
    flex: 0 0 clamp(96px, 17%, 200px);
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2px 4px;
  }

  .row-label .kr {
    font-size: clamp(10px, 1.5vw, 18px);
    white-space: nowrap;
  }

  .row-label .en {
    font-size: clamp(7px, 0.9vw, 11px);
    letter-spacing: 1px;
    color: #bbb;
    margin-top: 2px;
    white-space: nowrap;
  }

  .row-value {
    flex: 1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 2px 8px;
    min-width: 0;
  }

  .row-value .val {
    font-size: clamp(13px, 2vw, 24px);
    font-weight: 700;
    color: #111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .row-value .placeholder {
    color: #bbb;
    font-weight: 400;
  }

  .underline-value {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: clamp(6px, 1.2vw, 16px);
    width: 100%;
  }

  .underline-value .ul-seg {
    display: inline-block;
    min-width: 2.6em;
    text-align: center;
    color: #111;
    border-bottom: 2px solid #111;
    padding-bottom: 2px;
  }

  .underline-value .ul-seg.empty {
    color: transparent;
  }

  .underline-value .ul-dot {
    color: #111;
    font-weight: 900;
  }

  .gameno-boxes {
    display: flex;
    gap: clamp(3px, 0.8vw, 8px);
    width: 100%;
    justify-content: center;
  }

  .gameno-box {
    flex: 1;
    max-width: 60px;
    aspect-ratio: 1 / 1;
    border: 2px solid #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(14px, 2.2vw, 24px);
    font-weight: 800;
    background: #fff;
  }

  /* ---------- right panel ---------- */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: clamp(3px, 0.7vh, 8px);
    min-width: 0;
  }

  .team-block {
    flex: 1.1;
    display: flex;
    flex-direction: column;
    border: 2px solid #111;
    cursor: pointer;
    min-height: 0;
  }

  .team-head {
    background: #111;
    color: #fff;
    text-align: center;
    padding: 4px 0;
    flex: 0 0 auto;
  }

  .team-head b {
    font-size: clamp(15px, 2.4vw, 26px);
    font-style: italic;
  }

  .team-head span {
    font-size: clamp(9px, 1.3vw, 14px);
    color: #ccc;
    margin-left: 6px;
  }

  .team-name {
    flex: 1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 8px;
    min-height: 0;
  }

  .team-name .val {
    font-size: clamp(14px, 2.3vw, 26px);
    font-weight: 800;
    color: #111;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  .vs-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 2px 0;
  }

  .vs-row .slash {
    color: #e2001a;
    font-size: clamp(16px, 2.6vw, 26px);
    font-weight: 800;
  }

  .vs-row .vs {
    font-size: clamp(22px, 4vw, 40px);
    font-weight: 900;
    font-style: italic;
    color: #111;
  }

  .score-row {
    flex: 1;
    display: flex;
    gap: clamp(3px, 0.8vw, 8px);
    min-height: 0;
  }

  .score-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 2px solid #e2001a;
    cursor: pointer;
    min-height: 0;
  }

  .score-head {
    background: #e2001a;
    color: #fff;
    text-align: center;
    font-size: clamp(10px, 1.5vw, 16px);
    font-weight: 800;
    padding: 3px 0;
    flex: 0 0 auto;
  }

  .score-value {
    flex: 1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .score-value .val {
    font-size: clamp(26px, 5vw, 56px);
    font-weight: 900;
    color: #111;
  }

  /* ---------- footer ---------- */
  .footer {
    position: relative;
    flex: 0 0 auto;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 22px);
    padding: clamp(6px, 1vh, 12px) clamp(14px, 2vw, 24px) clamp(9px, 1.4vh, 15px);
    overflow: hidden;
  }

  .footer::before {
    content: "";
    position: absolute;
    inset: 0;
    right: 30%;
    background: repeating-linear-gradient(
      115deg,
      rgba(255, 255, 255, 0.06) 0px,
      rgba(255, 255, 255, 0.06) 10px,
      transparent 10px,
      transparent 22px
    );
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 60%);
            mask-image: linear-gradient(90deg, transparent, #000 60%);
    pointer-events: none;
  }

  .footer::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: linear-gradient(90deg, #e2001a, #ff5b5b 45%, #e2001a);
  }

  .footer-item {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .footer-icon {
    width: clamp(20px, 2.6vw, 30px);
    height: clamp(20px, 2.6vw, 30px);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .footer-icon svg {
    width: 68%;
    height: 68%;
  }

  .footer-icon.ig {
    background: radial-gradient(circle at 30% 110%, #ffdb73, #fd5949 30%, #d6249f 60%, #285aeb);
  }

  .footer-icon.yt {
    background: #ff0000;
    border-radius: 7px;
  }

  .footer-text {
    font-size: clamp(9px, 1.3vw, 14px);
    line-height: 1.3;
  }

  .footer-text .line1 {
    font-weight: 700;
  }

  .footer-text .line2 {
    color: #ccc;
  }

  .footer-divider {
    position: relative;
    z-index: 1;
    flex: 1;
    height: 3px;
    background: repeating-linear-gradient(
      90deg,
      #e2001a 0px,
      #e2001a 12px,
      transparent 12px,
      transparent 20px
    );
  }

  /* ---------- floating buttons ---------- */
  .float-btn {
    width: 30px;
    height: 26px;
    border-radius: 7px;
    background: #2e2e34;
    color: #fff;
    border: none;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .float-btn:active {
    transform: scale(0.94);
  }

  /* ---------- modal ---------- */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-bg.open {
    display: flex;
  }

  .modal {
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
    background: #1c1c20;
    border-radius: 20px;
    padding: 26px;
    text-align: center;
    color: #fff;
  }

  .modal h2 {
    margin: 0 0 18px;
    font-size: 22px;
  }

  .modal input[type="text"],
  .modal input[type="date"],
  .modal input[type="time"],
  .modal input[type="number"] {
    width: 100%;
    font-size: 22px;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: none;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  .gameno-inputs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .gameno-inputs input {
    width: 46px;
    height: 56px;
    font-size: 24px;
    text-align: center;
    border-radius: 10px;
    border: none;
  }

  .score-stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 16px;
  }

  .score-stepper button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: #3a3a44;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
  }

  .score-stepper button:active {
    transform: scale(0.94);
  }

  .score-stepper .score-big {
    font-size: 44px;
    font-weight: 900;
    min-width: 70px;
  }

  .modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  .modal-buttons button {
    flex: 1;
    font-size: 18px;
    font-weight: 700;
    padding: 14px;
    border: none;
    border-radius: 12px;
    color: #fff;
  }

  .btn-confirm {
    background: #e2001a;
  }

  .btn-cancel {
    background: #555;
  }
</style>
</head>
<body>

<div class="page">
  <div class="top-controls">
    <button id="resetBtn" class="float-btn" onclick="resetAll()" title="초기화" aria-label="초기화">↺</button>
    <button id="fullscreenBtn" class="float-btn" onclick="toggleFullscreen()" title="전체화면" aria-label="전체화면">⛶</button>
  </div>

  <div class="banner">
    <div class="banner-black" onclick="openText('bannerTitle','대회 로고 제목','예: BASKETBALL')">
      <p class="banner-title headline" id="bannerTitleText">BASKETBALL</p>
      <div class="banner-underline"></div>
      <p class="banner-subtitle headline" id="bannerSubtitleText">KOREA SPORTS ACADEMY</p>
    </div>

    <div class="hoop-wrap" onclick="openText('bannerSubtitle','부제목','예: KOREA SPORTS ACADEMY')">
      <svg viewBox="0 0 140 140">
        <defs>
          <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffb066" />
            <stop offset="45%" stop-color="#ff7a1a" />
            <stop offset="100%" stop-color="#c9550a" />
          </linearGradient>
        </defs>
        <ellipse cx="70" cy="34" rx="56" ry="13" fill="none" stroke="url(#rimGrad)" stroke-width="10" />
        <ellipse cx="70" cy="34" rx="56" ry="13" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="1" />
        <g stroke="#e8e8e8" stroke-width="1.6" opacity="0.95">
          <line x1="20" y1="38" x2="36" y2="112" />
          <line x1="35" y1="40" x2="44" y2="116" />
          <line x1="52" y1="42" x2="54" y2="120" />
          <line x1="70" y1="42" x2="70" y2="122" />
          <line x1="88" y1="42" x2="86" y2="120" />
          <line x1="105" y1="40" x2="96" y2="116" />
          <line x1="120" y1="38" x2="104" y2="112" />
          <line x1="26" y1="54" x2="114" y2="54" />
          <line x1="30" y1="70" x2="110" y2="70" />
          <line x1="36" y1="88" x2="104" y2="88" />
          <line x1="42" y1="104" x2="98" y2="104" />
        </g>
      </svg>
    </div>
  </div>

  <div class="content">
    <div class="left-panel">
      <div class="row" onclick="openText('tournament','대회명','대회명을 입력하세요')">
        <div class="row-label"><div class="kr">대회명</div><div class="en headline">TOURNAMENT</div></div>
        <div class="row-value"><div class="val" id="tournamentText">&nbsp;</div></div>
      </div>

      <div class="row" onclick="openText('gameTitle','경기명','경기명을 입력하세요')">
        <div class="row-label"><div class="kr">경기명</div><div class="en headline">GAME TITLE</div></div>
        <div class="row-value"><div class="val" id="gameTitleText">&nbsp;</div></div>
      </div>

      <div class="row" onclick="openGameNo()">
        <div class="row-label"><div class="kr">경기고유번호</div><div class="en headline">GAME NO.</div></div>
        <div class="row-value">
          <div class="gameno-boxes" id="gameNoBoxes"></div>
        </div>
      </div>

      <div class="row" onclick="openDate()">
        <div class="row-label"><div class="kr">날짜</div><div class="en headline">DATE</div></div>
        <div class="row-value">
          <div class="val underline-value" id="dateText">
            <span class="ul-seg" id="dateY">YYYY</span><span class="ul-dot">.</span><span class="ul-seg" id="dateM">MM</span><span class="ul-dot">.</span><span class="ul-seg" id="dateD">DD</span>
          </div>
        </div>
      </div>

      <div class="row" onclick="openTime()">
        <div class="row-label"><div class="kr">경기 시작시간</div><div class="en headline">START TIME</div></div>
        <div class="row-value">
          <div class="val underline-value" id="timeText">
            <span class="ul-seg" id="timeH">HH</span><span class="ul-dot">:</span><span class="ul-seg" id="timeM">MM</span>
          </div>
        </div>
      </div>

      <div class="row" onclick="openText('camera','촬영 카메라','예: CAM 1 / GoPro')">
        <div class="row-label"><div class="kr">촬영 카메라</div><div class="en headline">CAMERA</div></div>
        <div class="row-value"><div class="val" id="cameraText">&nbsp;</div></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="team-block" onclick="openText('homeTeam','홈 팀 이름','예: 고려대스포츠아카데미')">
        <div class="team-head"><b class="headline">HOME</b><span class="headline">TEAM</span></div>
        <div class="team-name"><div class="val" id="homeTeamText">&nbsp;</div></div>
      </div>

      <div class="vs-row">
        <span class="slash">/</span><span class="vs headline">VS</span><span class="slash">/</span>
      </div>

      <div class="team-block" onclick="openText('awayTeam','원정 팀 이름','예: 상대팀 이름')">
        <div class="team-head"><b class="headline">AWAY</b><span class="headline">TEAM</span></div>
        <div class="team-name"><div class="val" id="awayTeamText">&nbsp;</div></div>
      </div>

      <div class="score-row">
        <div class="score-block" onclick="openScore('homeScore')">
          <div class="score-head headline">HOME SCORE</div>
          <div class="score-value"><div class="val" id="homeScoreText">0</div></div>
        </div>
        <div class="score-block" onclick="openScore('awayScore')">
          <div class="score-head headline">AWAY SCORE</div>
          <div class="score-value"><div class="val" id="awayScoreText">0</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-item" onclick="openText('igHandle','인스타그램 계정','예: @your_instagram')">
      <div class="footer-icon ig">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="4.6" stroke="#fff" stroke-width="1.8"/><circle cx="17.6" cy="6.4" r="1.15" fill="#fff"/></svg>
      </div>
      <div class="footer-text">
        <div class="line1" id="igHandleText">@your_instagram</div>
        <div class="line2" id="igNameText2">학원명을 입력하세요</div>
      </div>
    </div>

    <div class="footer-divider"></div>

    <div class="footer-item" onclick="openText('ytName','유튜브 채널명','예: 채널명')">
      <div class="footer-icon yt">
        <svg viewBox="0 0 24 24"><path d="M9.5 8.6L16 12l-6.5 3.4z" fill="#fff"/></svg>
      </div>
      <div class="footer-text">
        <div class="line1" id="ytNameText">채널명을 입력하세요</div>
      </div>
    </div>
  </div>
</div>

<!-- generic text modal -->
<div id="textModalBg" class="modal-bg">
  <div class="modal">
    <h2 id="textModalTitle">입력</h2>
    <input type="text" id="textModalInput" />
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('textModalBg')">취소</button>
      <button class="btn-confirm" onclick="confirmText()">확인</button>
    </div>
  </div>
</div>

<!-- game number modal -->
<div id="gameNoModalBg" class="modal-bg">
  <div class="modal">
    <h2>경기고유번호</h2>
    <div class="gameno-inputs" id="gameNoInputs"></div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('gameNoModalBg')">취소</button>
      <button class="btn-confirm" onclick="confirmGameNo()">확인</button>
    </div>
  </div>
</div>

<!-- date modal -->
<div id="dateModalBg" class="modal-bg">
  <div class="modal">
    <h2>날짜</h2>
    <input type="date" id="dateModalInput" />
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('dateModalBg')">취소</button>
      <button class="btn-confirm" onclick="confirmDate()">확인</button>
    </div>
  </div>
</div>

<!-- time modal -->
<div id="timeModalBg" class="modal-bg">
  <div class="modal">
    <h2>경기 시작시간</h2>
    <input type="time" id="timeModalInput" />
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('timeModalBg')">취소</button>
      <button class="btn-confirm" onclick="confirmTime()">확인</button>
    </div>
  </div>
</div>

<!-- score modal -->
<div id="scoreModalBg" class="modal-bg">
  <div class="modal">
    <h2 id="scoreModalTitle">점수</h2>
    <div class="score-stepper">
      <button onclick="stepScore(-1)">−</button>
      <div class="score-big" id="scoreModalValue">0</div>
      <button onclick="stepScore(1)">+</button>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('scoreModalBg')">취소</button>
      <button class="btn-confirm" onclick="confirmScore()">확인</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "basketball_slate_data";

  const defaultData = {
    bannerTitle: "BASKETBALL",
    bannerSubtitle: "KOREA SPORTS ACADEMY",
    tournament: "",
    gameTitle: "",
    gameNo: ["", "", "", "", ""],
    date: "",
    time: "",
    camera: "",
    homeTeam: "",
    awayTeam: "",
    homeScore: 0,
    awayScore: 0,
    igHandle: "@your_instagram",
    igName: "학원명을 입력하세요",
    ytName: "채널명을 입력하세요"
  };

  let data = loadData();
  let currentTextField = null;
  let currentScoreField = null;
  let scoreModalTemp = 0;

  function loadData() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        return Object.assign({}, defaultData, saved);
      }
    } catch (e) {}
    return Object.assign({}, defaultData);
  }

  function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function render() {
    document.getElementById("bannerTitleText").textContent = data.bannerTitle || "BASKETBALL";
    document.getElementById("bannerSubtitleText").textContent = data.bannerSubtitle || "KOREA SPORTS ACADEMY";

    setValueText("tournamentText", data.tournament, "대회명을 입력하세요");
    setValueText("gameTitleText", data.gameTitle, "경기명을 입력하세요");
    setValueText("cameraText", data.camera, "촬영 카메라를 입력하세요");
    setValueText("homeTeamText", data.homeTeam, "HOME TEAM");
    setValueText("awayTeamText", data.awayTeam, "AWAY TEAM");

    document.getElementById("homeScoreText").textContent = data.homeScore;
    document.getElementById("awayScoreText").textContent = data.awayScore;

    renderGameNoBoxes();
    renderDateSegments();
    renderTimeSegments();

    document.getElementById("igHandleText").textContent = data.igHandle || "@your_instagram";
    document.getElementById("igNameText2").textContent = data.igName || "학원명을 입력하세요";
    document.getElementById("ytNameText").textContent = data.ytName || "채널명을 입력하세요";
  }

  function setValueText(elId, value, placeholder) {
    const el = document.getElementById(elId);
    if (value) {
      el.textContent = value;
      el.classList.remove("placeholder");
    } else {
      el.innerHTML = '<span class="placeholder">' + placeholder + "</span>";
    }
  }

  function renderGameNoBoxes() {
    const box = document.getElementById("gameNoBoxes");
    box.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const div = document.createElement("div");
      div.className = "gameno-box";
      div.textContent = data.gameNo[i] || "";
      box.appendChild(div);
    }
  }

  function setSegment(elId, value, placeholder) {
    const el = document.getElementById(elId);
    if (value) {
      el.textContent = value;
      el.classList.remove("empty");
    } else {
      el.textContent = placeholder;
      el.classList.add("empty");
    }
  }

  function renderDateSegments() {
    const parts = data.date ? data.date.split("-") : ["", "", ""];
    setSegment("dateY", parts[0], "YYYY");
    setSegment("dateM", parts[1], "MM");
    setSegment("dateD", parts[2], "DD");
  }

  function renderTimeSegments() {
    const parts = data.time ? data.time.split(":") : ["", ""];
    setSegment("timeH", parts[0], "HH");
    setSegment("timeM", parts[1], "MM");
  }

  /* ---------- generic text modal ---------- */
  function openText(field, title, placeholder) {
    currentTextField = field;
    document.getElementById("textModalTitle").textContent = title;
    const input = document.getElementById("textModalInput");
    input.value = data[field] || "";
    input.placeholder = placeholder || "";
    openModal("textModalBg");
    setTimeout(() => input.focus(), 50);
  }

  function confirmText() {
    const value = document.getElementById("textModalInput").value.trim();
    data[currentTextField] = value;
    saveData();
    render();
    closeModal("textModalBg");
  }

  /* ---------- game number modal ---------- */
  function openGameNo() {
    const wrap = document.getElementById("gameNoInputs");
    wrap.innerHTML = "";
    for (let i = 0; i < 5; i++) {
      const input = document.createElement("input");
      input.type = "text";
      input.inputMode = "numeric";
      input.maxLength = 1;
      input.value = data.gameNo[i] || "";
      input.dataset.idx = i;
      input.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 1);
        if (e.target.value && i < 4) {
          wrap.children[i + 1].focus();
        }
      });
      wrap.appendChild(input);
    }
    openModal("gameNoModalBg");
  }

  function confirmGameNo() {
    const inputs = document.getElementById("gameNoInputs").children;
    const newGameNo = [];
    for (let i = 0; i < inputs.length; i++) {
      newGameNo.push(inputs[i].value || "");
    }
    data.gameNo = newGameNo;
    saveData();
    render();
    closeModal("gameNoModalBg");
  }

  /* ---------- date modal ---------- */
  function openDate() {
    document.getElementById("dateModalInput").value = data.date || "";
    openModal("dateModalBg");
  }

  function confirmDate() {
    data.date = document.getElementById("dateModalInput").value;
    saveData();
    render();
    closeModal("dateModalBg");
  }

  /* ---------- time modal ---------- */
  function openTime() {
    document.getElementById("timeModalInput").value = data.time || "";
    openModal("timeModalBg");
  }

  function confirmTime() {
    data.time = document.getElementById("timeModalInput").value;
    saveData();
    render();
    closeModal("timeModalBg");
  }

  /* ---------- score modal ---------- */
  function openScore(field) {
    currentScoreField = field;
    scoreModalTemp = Number(data[field]) || 0;
    document.getElementById("scoreModalTitle").textContent =
      field === "homeScore" ? "HOME SCORE" : "AWAY SCORE";
    document.getElementById("scoreModalValue").textContent = scoreModalTemp;
    openModal("scoreModalBg");
  }

  function stepScore(delta) {
    scoreModalTemp = Math.max(0, scoreModalTemp + delta);
    document.getElementById("scoreModalValue").textContent = scoreModalTemp;
  }

  function confirmScore() {
    data[currentScoreField] = scoreModalTemp;
    saveData();
    render();
    closeModal("scoreModalBg");
  }

  /* ---------- modal helpers ---------- */
  function openModal(id) {
    document.getElementById(id).classList.add("open");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("open");
  }

  function resetAll() {
    if (!confirm("모든 항목을 초기화할까요?")) return;
    data = Object.assign({}, defaultData, { gameNo: ["", "", "", "", ""] });
    saveData();
    render();
  }

  function toggleFullscreen() {
    const page = document.documentElement;
    if (!document.fullscreenElement) {
      if (page.requestFullscreen) page.requestFullscreen();
      else if (page.webkitRequestFullscreen) page.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  render();
</script>
</body>
</html>
