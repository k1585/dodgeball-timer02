<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORMDOT · B 제작 구성기</title>
<meta name="theme-color" content="#111214">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 공통 컴포넌트 — 각 시안이 아래 변수만 바꿔서 자기 스타일로 씀 */
:root{--fd-bg:#202124;--fd-surface:#2a2b30;--fd-surface2:#232428;--fd-line:#3b3d44;--fd-text:#fff;--fd-muted:#a3a7b0;
  --fd-accent:#2962ff;--fd-accent-text:#8aaaff;--fd-accent-soft:rgba(41,98,255,.16);--fd-ok:#34c778;--fd-warn:#f5b941;--fd-warn-soft:rgba(245,185,65,.14);
  --fd-bad:#ff7b7b;--fd-r:14px;--fd-r-sm:10px;--fd-font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --fd-focus:0 0 0 3px rgba(41,98,255,.45)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.fd-ic{display:inline-flex;width:1.25em;height:1.25em;flex:none}.fd-ic svg{width:100%;height:100%}
.fd-logo{display:inline-flex;align-items:center;gap:.5em;color:var(--fd-text)}.fd-logo-sym{width:1.6em;height:auto;color:#f7f8fa}.fd-logo-word{width:6em;height:auto}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:none;box-shadow:var(--fd-focus)}
.fd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--fd-r-sm);border:1px solid var(--fd-line);
  background:var(--fd-surface);color:var(--fd-text);font:700 15px/1 var(--fd-font);cursor:pointer;text-decoration:none;transition:transform .12s,filter .2s,background-color .2s}
.fd-btn:active{transform:scale(.97)}
.fd-btn.primary{background:var(--fd-accent);border-color:var(--fd-accent);color:#fff}.fd-btn.primary:hover{filter:brightness(1.08)}
.fd-btn.ghost{background:transparent}.fd-btn.sm{min-height:36px;font-size:13px;padding:0 12px}.fd-btn.danger{color:var(--fd-bad)}
.fd-btn.kakao{background:#fee500;border-color:#fee500;color:#191919}.fd-btn.store{background:#03c75a;border-color:#03c75a;color:#fff}
.fd-btn[disabled]{opacity:.45;cursor:not-allowed}
.fd-in{width:100%;min-height:46px;padding:11px 13px;border-radius:var(--fd-r-sm);border:1px solid var(--fd-line);background:var(--fd-surface2);color:var(--fd-text);font:16px/1.4 var(--fd-font)}
textarea.fd-in{resize:vertical}.fd-in::placeholder{color:var(--fd-muted);opacity:.75}
.fd-field{margin:0 0 18px}.fd-field.bad .fd-in,.fd-field.bad .fd-drop{border-color:var(--fd-bad)}
.fd-label{display:block;font-weight:700;font-size:14.5px;margin:0 0 7px}.fd-req{color:var(--fd-bad);font-style:normal;margin-left:3px}
.fd-help{color:var(--fd-muted);font-size:13px;line-height:1.55;margin:-3px 0 8px}
.fd-err{color:var(--fd-bad);font-size:13px;margin-top:6px}
.fd-dims{display:flex;align-items:center;gap:6px}.fd-dims span{color:var(--fd-muted)}.fd-dims .fd-in{text-align:center}
.fd-chips{display:flex;flex-wrap:wrap;gap:6px}.fd-radios{display:grid;gap:8px}
.fd-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 13px;border-radius:var(--fd-r-sm);border:1.5px solid var(--fd-line);
  background:var(--fd-surface2);color:var(--fd-text);font:600 14px/1.35 var(--fd-font);cursor:pointer;text-align:left}
.fd-chips .fd-opt{border-radius:99px;padding:8px 13px}
.fd-opt small{font-weight:400;color:var(--fd-muted);font-size:12.5px}
.fd-opt.on{border-color:var(--fd-accent);background:var(--fd-accent-soft)}.fd-opt.on b{color:var(--fd-accent-text)}
.fd-drop{display:flex;align-items:center;gap:12px;padding:18px;border:1.5px dashed var(--fd-line);border-radius:var(--fd-r);background:var(--fd-surface2);cursor:pointer;color:var(--fd-text)}
.fd-drop .fd-ic{width:26px;height:26px;color:var(--fd-accent-text)}.fd-drop b{display:block;font-size:14.5px}.fd-drop small{display:block;color:var(--fd-muted);font-size:12.5px;margin-top:2px}
.fd-drop.over{border-color:var(--fd-accent);background:var(--fd-accent-soft)}.fd-drop.sm{padding:11px 14px}
.fd-flist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fd-file{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:99px;background:var(--fd-accent-soft);font-size:13px}
.fd-file small{color:var(--fd-muted)}.fd-file button{border:0;background:transparent;color:var(--fd-text);font-size:16px;cursor:pointer;width:24px;height:24px;border-radius:50%}
.fd-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--fd-accent-soft);color:var(--fd-accent-text)}
.fd-badge.ok{background:rgba(52,199,120,.15);color:var(--fd-ok)}.fd-badge.warn{background:var(--fd-warn-soft);color:var(--fd-warn)}
/* 견적 */
.fd-quote{border-radius:var(--fd-r);padding:18px;background:var(--fd-accent-soft);border:1px solid color-mix(in srgb,var(--fd-accent) 40%,transparent)}
.fd-quote.review{background:var(--fd-warn-soft);border-color:color-mix(in srgb,var(--fd-warn) 45%,transparent)}
.fd-quote.reject{background:rgba(255,123,123,.1);border-color:rgba(255,123,123,.4)}.fd-quote.empty{background:var(--fd-surface2);border-color:var(--fd-line)}
.fd-q-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fd-muted);font-weight:600}
.fd-q-total{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}.fd-q-total small{font-size:13px;color:var(--fd-muted);font-weight:600}
.fd-q-meta{font-size:13px;color:var(--fd-muted)}
.fd-q-lines{margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--fd-line);font-size:13.5px}.fd-q-lines div{display:flex;justify-content:space-between;margin:3px 0}.fd-q-lines dd{margin:0;font-variant-numeric:tabular-nums}
.fd-q-why{margin-top:10px;font-size:13.5px}.fd-q-why b{display:block;margin-bottom:3px}.fd-q-why p{margin:3px 0}
.fd-q-reason{font-weight:600;margin:6px 0}.fd-q-note{font-size:12.5px;color:var(--fd-muted);margin:8px 0 0;line-height:1.5}
/* 상태 */
.fd-status{padding:18px;border-radius:var(--fd-r);background:var(--fd-surface);border:1px solid var(--fd-line)}
.fd-st-head{display:flex;align-items:center;gap:8px}.fd-st-no{font-weight:800;font-size:20px;letter-spacing:.04em}.fd-st-title{margin:6px 0 12px;color:var(--fd-muted)}
.fd-steps{list-style:none;padding:0;margin:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.fd-steps li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--fd-muted);text-align:center}
.fd-steps i{width:100%;height:5px;border-radius:9px;background:var(--fd-line)}.fd-steps li.past i{background:color-mix(in srgb,var(--fd-accent) 55%,transparent)}
.fd-steps li.now i{background:var(--fd-accent)}.fd-steps li.now{color:var(--fd-text);font-weight:700}
.fd-st-desc{margin:12px 0}.fd-st-meta{font-size:12.5px;color:var(--fd-muted);margin-top:10px}
.fd-unset{padding:12px 14px;border-radius:var(--fd-r-sm);border:1px dashed var(--fd-warn);color:var(--fd-warn);font-size:13.5px;margin:10px 0}.fd-unset small{display:block;color:var(--fd-muted);margin-top:2px}
.fd-lk,.fd-otp{display:grid;gap:4px}.fd-lk .fd-btn,.fd-otp .fd-btn{width:100%;margin-top:4px}
.fd-demo-code{padding:10px 12px;border-radius:var(--fd-r-sm);background:var(--fd-warn-soft);color:var(--fd-warn);font-size:13.5px;margin-bottom:10px}.fd-demo-code code{font-size:17px;letter-spacing:.15em;margin-left:6px;color:var(--fd-text)}
.fd-lk-result{display:grid;gap:10px}
/* 완료 */
.fd-done{text-align:center;padding:10px 0}.fd-done h2{font-size:22px;margin:12px 0 16px;letter-spacing:-.02em}
.fd-done-ic{width:58px;height:58px;margin:0 auto;border-radius:50%;background:var(--fd-accent);color:#fff;display:flex;align-items:center;justify-content:center}.fd-done-ic .fd-ic{width:30px;height:30px}
.fd-done-no{display:inline-block;padding:14px 28px;border-radius:var(--fd-r);background:var(--fd-surface2);border:1px solid var(--fd-line)}.fd-done-no small{display:block;color:var(--fd-muted);font-size:12.5px}
.fd-done-no b{font-size:40px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.fd-next{text-align:left;max-width:420px;margin:16px auto;padding-left:20px;line-height:1.7;font-size:14.5px}.fd-next small{color:var(--fd-muted)}
.fd-done-sum{color:var(--fd-muted);font-size:13.5px;margin-top:10px}
/* 기타 */
.fd-switch{display:flex;align-items:center;gap:10px;cursor:pointer}.fd-switch input{position:absolute;opacity:0}
.fd-switch span{width:42px;height:25px;border-radius:99px;background:var(--fd-line);position:relative;transition:background .2s;flex:none}
.fd-switch span::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s}
.fd-switch input:checked+span{background:var(--fd-accent)}.fd-switch input:checked+span::after{transform:translateX(17px)}.fd-switch input:focus-visible+span{box-shadow:var(--fd-focus)}
.fd-stu{padding:14px;border-radius:var(--fd-r);border:1px solid var(--fd-line);background:var(--fd-surface2);margin:0 0 14px}.fd-stu-body{margin-top:10px}
.fd-stu-st{font-size:13px;margin-top:6px}.fd-stu-st.ok{color:var(--fd-ok)}.fd-stu-st.bad{color:var(--fd-bad)}
.fd-consent{display:flex;gap:10px;align-items:flex-start;padding:13px;border-radius:var(--fd-r);border:1px solid var(--fd-line);cursor:pointer;font-size:14px}
.fd-consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--fd-accent);flex:none}.fd-consent small{display:block;color:var(--fd-muted);font-size:12px;margin-top:2px}
.fd-toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;padding:11px 18px;border-radius:99px;background:#f2f4f7;color:#202124;font:600 14px var(--fd-font);z-index:999;transition:.25s;pointer-events:none}
.fd-toast.on{opacity:1;transform:translate(-50%,0)}
.fd-demo{font:13px/1.5 var(--fd-font);padding:8px 14px;background:#f5b941;color:#1a1a1a;text-align:center}.fd-demo a{color:inherit;font-weight:700;margin-left:6px}
.fd-empty{padding:28px 10px;text-align:center;color:var(--fd-muted);font-size:14px}
.fd-row{display:flex;gap:8px;align-items:center}.fd-row .fd-in{flex:1}
/* 관리자 */
.fd-adm-login{max-width:380px;margin:40px auto;text-align:center}.fd-adm-login form{display:grid;gap:8px;margin-top:14px}
.fd-adm-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fd-adm-top>b{font-size:18px}
.fd-adm-tabs{display:flex;gap:4px;overflow-x:auto;flex:1}.fd-adm-tabs button{border:0;background:transparent;color:var(--fd-muted);font:600 14px var(--fd-font);padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.fd-adm-tabs button.on{background:var(--fd-surface);color:var(--fd-text)}.fd-adm-tabs i{font-style:normal;background:var(--fd-warn);color:#1a1a1a;border-radius:99px;padding:0 6px;font-size:11px;margin-left:3px}
.fd-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.fd-kpi{padding:12px;border-radius:var(--fd-r-sm);background:var(--fd-surface);border:1px solid var(--fd-line)}
.fd-kpi small{display:block;color:var(--fd-muted);font-size:12px}.fd-kpi b{font-size:22px}
.fd-adm-tools{display:grid;gap:8px;margin-bottom:10px}
.fd-seg{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}.fd-seg button{border:1px solid var(--fd-line);background:transparent;color:var(--fd-muted);font:600 13px var(--fd-font);padding:7px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.fd-seg button.on{background:var(--fd-accent);border-color:var(--fd-accent);color:#fff}
.fd-adm-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:12px;align-items:start}
.fd-olist{display:grid;gap:6px}.fd-orow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--fd-r-sm);border:1px solid var(--fd-line);background:var(--fd-surface);color:var(--fd-text);text-align:left;cursor:pointer;font:14px var(--fd-font)}
.fd-orow.on{border-color:var(--fd-accent)}.fd-orow-no{font-weight:800;font-variant-numeric:tabular-nums}.fd-orow-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fd-orow-t small{display:block;color:var(--fd-muted);font-size:12px}
.fd-st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--fd-line);color:var(--fd-text);white-space:nowrap}
.fd-st.review{background:var(--fd-warn-soft);color:var(--fd-warn)}.fd-st.pay_wait,.fd-st.received{background:var(--fd-accent-soft);color:var(--fd-accent-text)}.fd-st.making{background:rgba(52,199,120,.15);color:var(--fd-ok)}
.fd-odetail{padding:16px;border-radius:var(--fd-r);background:var(--fd-surface);border:1px solid var(--fd-line);position:sticky;top:12px}
.fd-od-head{font-size:18px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.fd-od{margin:0;font-size:13.5px}.fd-od div{display:grid;grid-template-columns:80px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--fd-line)}.fd-od dt{color:var(--fd-muted)}.fd-od dd{margin:0}
.fd-od-box{margin-top:12px}.fd-od-box .fd-btn{flex:none}.fd-od-box textarea{margin-bottom:6px}
.fd-od-log{margin:12px 0;font-size:12.5px;color:var(--fd-muted)}.fd-od-log summary{cursor:pointer}
.fd-sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.fd-set{display:grid;grid-template-columns:1fr 100px auto;align-items:center;gap:6px;font-size:13px;padding:8px 10px;border-radius:var(--fd-r-sm);background:var(--fd-surface);border:1px solid var(--fd-line)}
.fd-set .fd-in{min-height:36px;padding:6px 8px;font-size:14px}.fd-set em{font-style:normal;color:var(--fd-muted);font-size:12px}.fd-set.wide{grid-template-columns:auto 1fr}
.fd-adm h3{font-size:15px;margin:18px 0 8px}
.fd-chan{display:grid;gap:8px}.fd-chan-i{display:grid;grid-template-columns:1fr auto;gap:4px;padding:12px;border-radius:var(--fd-r-sm);background:var(--fd-surface);border:1px solid var(--fd-line)}.fd-chan-i small{grid-column:1/-1;color:var(--fd-muted)}
.fd-nlog{display:grid;gap:4px;font-size:12.5px}.fd-nlog div{display:flex;flex-wrap:wrap;gap:4px 10px;padding:8px 10px;border-radius:8px;background:var(--fd-surface)}.fd-nlog em{color:var(--fd-warn);font-style:normal}
.fd-pfadm{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.fd-pfadm img{width:100%;border-radius:8px;display:block}.fd-pfadm b{display:block;font-size:13px;margin-top:4px}.fd-pfadm small{color:var(--fd-muted);font-size:11.5px}
@media (max-width:720px){.fd-adm-split{grid-template-columns:1fr}.fd-kpis{grid-template-columns:repeat(2,1fr)}.fd-odetail{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 출력 옵션 패널 */
.fd-mats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fd-mat{text-align:left;padding:10px 11px;border-radius:var(--fd-r-sm);border:1.5px solid var(--fd-line);background:var(--fd-surface2);color:var(--fd-text);cursor:pointer;font:14px var(--fd-font)}
.fd-mat b{display:block;font-size:13.5px}.fd-mat small{display:block;font-size:11.5px;color:var(--fd-muted);margin-top:2px}
.fd-mat.on{border-color:var(--fd-accent);background:var(--fd-accent-soft)}
.fd-dots{display:flex;flex-wrap:wrap;gap:8px}
.fd-dot{width:32px;height:32px;border-radius:50%;background:var(--c);border:2px solid rgba(128,128,128,.35);cursor:pointer;padding:0}
.fd-dot.on{box-shadow:0 0 0 2px var(--fd-bg),0 0 0 4px var(--fd-accent)}
.fd-dot.clear{background:repeating-conic-gradient(#d4d6db 0 25%,#f5f6f8 0 50%) 50%/10px 10px}.fd-dot.other{background:conic-gradient(#ff4d4d,#ffcc00,#33cc66,#3399ff,#9966ff,#ff4d4d)}
.fd-cname{font-weight:500;color:var(--fd-muted);margin-left:6px;font-size:13px}
.fd-seg.q button{flex:1}
.fd-qty{display:inline-flex;align-items:center;border:1px solid var(--fd-line);border-radius:var(--fd-r-sm);overflow:hidden}
.fd-qty button{width:44px;height:44px;border:0;background:var(--fd-surface2);color:var(--fd-text);font-size:20px;cursor:pointer}.fd-qty .fd-in{width:64px;border:0;border-radius:0;text-align:center;min-height:44px}
.fd-adv{border:1px solid var(--fd-line);border-radius:var(--fd-r);padding:0 14px;margin-top:6px}
.fd-adv summary{cursor:pointer;padding:13px 0;font-weight:700;font-size:14.5px}.fd-adv summary small{font-weight:400;color:var(--fd-muted);margin-left:6px;font-size:12px}
.fd-adv-sec{padding:4px 0 12px}.fd-adv-sec>b{display:block;font-size:13px;margin:6px 0}
.fd-adv-row{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;font-size:13px;padding:3px 0}.fd-adv-row .fd-in{min-height:36px;padding:6px 8px;font-size:14px}
.fd-link{border:0;background:none;color:var(--fd-accent-text);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.fd-minfo{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--fd-muted);margin-top:8px}.fd-minfo b{color:var(--fd-text);width:100%}
.fd-merr{padding:12px;border-radius:var(--fd-r-sm);background:rgba(255,123,123,.1);color:var(--fd-bad);font-size:13.5px;margin-top:8px}.fd-merr b{display:block;color:var(--fd-text)}
.busy{position:relative;pointer-events:none;opacity:.7}.busy::after{content:"분석 중…";position:absolute;inset:auto 0 8px;text-align:center;font:600 13px var(--fd-font);color:var(--fd-accent-text)}
@media (max-width:560px){.fd-mats{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}.fd-mat{flex:0 0 120px}.fd-adv-row{grid-template-columns:1fr 130px}}
.fd-etc{margin-top:8px}
/* 휴대폰에서 누를 때 파란 하이라이트·글자 선택 안 생기게 (입력칸은 그대로 선택 가능) */
html{-webkit-tap-highlight-color:transparent}
button,a,.fd-opt,.choice,.fd-drop,label,summary,[role="button"]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-user-select:text;user-select:text}

/* ? 설명 버튼 */
.fd-q{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:6px;border-radius:50%;border:1.5px solid currentColor;
  font:800 12px/1 var(--fd-font);color:var(--fd-accent-text);vertical-align:2px;cursor:pointer;flex:none;opacity:.9}
.fd-q:hover,.fd-q:focus-visible{background:var(--fd-accent);border-color:var(--fd-accent);color:#fff;opacity:1}
.fd-qall{display:inline-flex;align-items:center;gap:2px;margin-top:8px;padding:6px 10px 6px 2px;border:0;background:none;color:var(--fd-accent-text);font:600 13px var(--fd-font);cursor:pointer}
.fd-qall .fd-q{margin:0 6px 0 0}
.fd-helpbox{margin-top:10px;padding:12px 14px;border-radius:var(--fd-r-sm);border:1px solid color-mix(in srgb,var(--fd-accent) 45%,transparent);background:var(--fd-accent-soft);display:grid;gap:10px;font-size:13.5px;line-height:1.6}
.fd-hi b{display:block;font-size:14px}.fd-hi p{margin:2px 0 0;color:var(--fd-text);opacity:.9}.fd-hi .fd-ex{color:var(--fd-accent-text);opacity:1}
.fd-hclose{justify-self:end;border:0;background:none;color:var(--fd-muted);font:600 12.5px var(--fd-font);cursor:pointer;padding:2px 4px}
.fd-helpbox{scroll-margin-bottom:130px;scroll-margin-top:80px}
</style>

:root{--fd-bg:#111214;--fd-surface:#1b1c20;--fd-surface2:#16171a;--fd-line:#2a2c32;--fd-muted:#959aa5;--fd-r:12px;--fd-r-sm:9px}

.tb{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;border-bottom:1px solid var(--fd-line);flex:none}
.tb .fd-logo{font-size:14px;text-decoration:none}
.svc-tabs{display:flex;gap:2px;background:var(--fd-surface2);border:1px solid var(--fd-line);border-radius:10px;padding:3px;margin-left:12px}
.svc-tabs button{border:0;background:transparent;color:var(--fd-muted);font:600 13.5px var(--fd-font);padding:7px 12px;border-radius:7px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.svc-tabs button .fd-ic{width:16px;height:16px}

.tb .r{margin-left:auto;display:flex;gap:4px}
.tb .r a{color:var(--fd-muted);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:8px}.tb .r a:hover,.tb .r a.on{color:var(--fd-text);background:var(--fd-surface)}
.ws{flex:1;display:grid;grid-template-columns:320px minmax(0,1fr) 360px;min-height:0}
.pane{overflow:auto;padding:18px;border-right:1px solid var(--fd-line);min-width:0}
.pane.r{border-right:0;border-left:1px solid var(--fd-line);display:flex;flex-direction:column;padding:0}

.pane h3{font-size:12px;letter-spacing:.12em;color:var(--fd-muted);margin:0 0 12px;font-weight:700}

.stage .zone.over{border-color:var(--fd-accent);background:var(--fd-accent-soft)}

.pf{border-radius:var(--fd-r);overflow:hidden;border:1px solid var(--fd-line);background:var(--fd-surface);cursor:pointer;text-align:left;padding:0;color:inherit;font:inherit}

.req-sum b{display:block;color:var(--fd-text);font-size:20px;margin-bottom:6px}
.mbar{display:none}
.intro{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--fd-line);font-size:13px;color:var(--fd-muted);flex:none}
.intro b{color:var(--fd-text)}.intro .fd-btn{margin-left:auto}
@media (max-width:1100px){.ws{grid-template-columns:280px minmax(0,1fr) 330px}}

  .mbar div{flex:1}.mbar small{display:block;color:var(--fd-muted);font-size:12px}.mbar b{font-size:20px}

const OPT_BY_ID = Object.fromEntries(OPTS.flatMap(s => s.items).map(o => [o.id, o]));
let ENGINE_OPTV = {};
function engineDefaults(){ const v = {}; for (const o of Object.values(OPT_BY_ID)) v[o.id] = String(o.def); return v; }
function optVal(id){
  const o = OPT_BY_ID[id], raw = ENGINE_OPTV[id] ?? o.def;
  if (o.type === "number"){ let v = parseFloat(raw); if (!isFinite(v)) v = o.def; return Math.min(o.max, Math.max(o.min, v)); }
  return String(raw);
}
function optData(id){ const o = OPT_BY_ID[id]; return (o.list.find(x => x[0] === String(ENGINE_OPTV[id] ?? o.def)) || o.list[0])[2] || {}; }
function optLabel(id){ const o = OPT_BY_ID[id]; if (o.type === "number") return optVal(id) + (o.unit || ""); const it = o.list.find(x => x[0] === optVal(id)); return it ? it[1] : ""; }

/* ---------------- 자체 추정 ---------------- */
function estimate(geo){
  if (!geo.fin) finalizeGeo(geo);
  const mat = optData("mat");
  const layerH = +optVal("layerH"), firstH = +optVal("firstLayerH"), lw = +optVal("lineW");
  const V = geo.vol;
  const [dx, dy, dz] = geo.max.map((v, i) => v - geo.min[i]);

  // 벽 + 상/하단 셸
  let wallV = geo.areaV * optVal("walls") * lw;
  let topV  = geo.areaUp * optVal("topL") * layerH;
  let botV  = geo.areaDown * optVal("botL") * layerH;
  const shellSum = wallV + topV + botV;
  if (shellSum > V){ const k = V / shellSum; wallV *= k; topV *= k; botV *= k; }
  const core = Math.max(0, V - wallV - topV - botV);

  // 내부 채움
  const pat = optData("pattern"), dens = optVal("infill") / 100;
  const infillV = core * dens * (dens >= 0.99 ? 1 : pat.m);

  // 서포트: 기준 각도보다 눕혀진 아랫면 × 바닥까지 높이
  let supV = 0;
  const supF = optData("supType").f;
  if (supF > 0){
    const ang = Math.round(optVal("supAngle"));
    let raw = 0; for (let i = 0; i < ang && i < 91; i++) raw += geo.supHist[i];
    supV = raw * 0.15 * supF * optData("supDensity").f;
  }

  // 바닥 접착
  const brimW = +optVal("brim");
  const brimV = brimW ? (2*(dx + dy) + Math.PI*brimW) * brimW * firstH : 0;
  const raftN = optVal("raft");
  const raftV = raftN ? (dx + 6) * (dy + 6) * layerH * raftN * 0.6 : 0;

  const ext = wallV + topV + botV + infillV + supV + brimV + raftV;          // mm³
  const g = ext / 1000 * mat.d + 0.5 + (mat.w || 0);                                        // + 프라임/퍼지 손실

  // 시간
  const layers = Math.max(1, Math.ceil((dz - firstH) / layerH) + 1) + raftN;
  const flow = 7 * Math.pow(layerH / 0.2, 0.8) * optData("speed").f * mat.s; // mm³/s
  const work = wallV + topV*optData("topPattern").t + botV*optData("bottomPattern").t
             + infillV*pat.t + supV*1.1 + brimV + raftV;
  const ironK = optData("ironing").k;
  const ironArea = ironK === 2 ? geo.areaUp : ironK === 1 ? geo.areaTopmost : 0;
  const sec = work / flow + layers * (mat.lt || 2) + ironArea / 3 + 240 + (mat.prep || 0) * 60;
  return {g, min: sec / 60, ext, layers, supV};
}
// 표면 방향 통계 + 서포트 히스토그램 (파일당 1번)
function finalizeGeo(geo){
  const zmin = geo.min[2], zmax = geo.max[2];
  let up = 0, down = 0, topmost = 0;
  const hist = new Float64Array(91);
  for (const ch of geo.chunks){
    for (let i = 0; i < ch.length; i += 9){
      const ux=ch[i+3]-ch[i], uy=ch[i+4]-ch[i+1], uz=ch[i+5]-ch[i+2];
      const vx=ch[i+6]-ch[i], vy=ch[i+7]-ch[i+1], vz=ch[i+8]-ch[i+2];
      const cx=uy*vz-uz*vy, cy=uz*vx-ux*vz, cz=ux*vy-uy*vx;
      const len = Math.hypot(cx, cy, cz); if (!len) continue;
      const area = len/2, nz = cz/len, proj = area*Math.abs(nz);
      const zc = (ch[i+2] + ch[i+5] + ch[i+8]) / 3;
      if (nz > 0){
        up += proj;
        if (nz > 0.95 && Math.min(ch[i+2], ch[i+5], ch[i+8]) > zmax - 0.05) topmost += proj;
      } else {
        down += proj;
        const h = zc - zmin;
        if (h > 0.3){
          const slope = Math.acos(Math.min(1, -nz)) * 180 / Math.PI;   // 수평면 기준 기울기
          hist[Math.min(90, Math.floor(slope))] += proj * h;
        }
      }
    }
  }
  geo.areaUp = up; geo.areaDown = down; geo.areaTopmost = topmost; geo.supHist = hist; geo.fin = true;
}
/* ---------------- 지오메트리 누적 ---------------- */
function newGeo(){
  return {vol:0, area:0, areaH:0, areaV:0, tris:0,
          min:[Infinity,Infinity,Infinity], max:[-Infinity,-Infinity,-Infinity], chunks:[]};
}
// 하나의 메쉬(정점 배열 pos[x,y,z...], 인덱스 idx) + 4x3 변환행렬 누적
function addMesh(geo, pos, idx, mtx){
  const n = idx.length/3;
  const out = new Float32Array(n*9);
  let vol = 0;
  const T = mtx || [1,0,0, 0,1,0, 0,0,1, 0,0,0];
  const tx = (i) => {
    const x=pos[i*3], y=pos[i*3+1], z=pos[i*3+2];
    return [x*T[0]+y*T[3]+z*T[6]+T[9], x*T[1]+y*T[4]+z*T[7]+T[10], x*T[2]+y*T[5]+z*T[8]+T[11]];
  };
  for (let t=0;t<n;t++){
    const a=tx(idx[t*3]), b=tx(idx[t*3+1]), c=tx(idx[t*3+2]);
    vol += triStats(geo, a, b, c);
    out.set(a, t*9); out.set(b, t*9+3); out.set(c, t*9+6);
  }
  geo.vol += Math.abs(vol);
  geo.chunks.push(out);
}
function triStats(geo, a, b, c){
  const ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
  const vx=c[0]-a[0], vy=c[1]-a[1], vz=c[2]-a[2];
  const cx=uy*vz-uz*vy, cy=uz*vx-ux*vz, cz=ux*vy-uy*vx;
  const len = Math.hypot(cx,cy,cz);
  const area = len/2;
  geo.area += area;
  if (len > 0){
    const nz = Math.abs(cz/len);
    geo.areaH += area*nz;
    geo.areaV += area*Math.sqrt(Math.max(0,1-nz*nz));
  }
  geo.tris++;
  for (const p of [a,b,c]) for (let k=0;k<3;k++){
    if (p[k]<geo.min[k]) geo.min[k]=p[k];
    if (p[k]>geo.max[k]) geo.max[k]=p[k];
  }
  // 부호 있는 사면체 부피
  return (a[0]*(b[1]*c[2]-b[2]*c[1]) - a[1]*(b[0]*c[2]-b[2]*c[0]) + a[2]*(b[0]*c[1]-b[1]*c[0])) / 6;
}

/* ---------------- STL ---------------- */
function parseSTL(buf){
  const dv = new DataView(buf);
  const geo = newGeo();
  const isBinary = buf.byteLength >= 84 && 84 + dv.getUint32(80, true)*50 === buf.byteLength;
  let vol = 0;
  if (isBinary){
    const n = dv.getUint32(80, true);
    const out = new Float32Array(n*9);
    for (let i=0;i<n;i++){
      const o = 84 + i*50 + 12;
      const p = [];
      for (let k=0;k<3;k++) p.push([dv.getFloat32(o+k*12,true), dv.getFloat32(o+k*12+4,true), dv.getFloat32(o+k*12+8,true)]);
      vol += triStats(geo, p[0], p[1], p[2]);
      out.set(p[0], i*9); out.set(p[1], i*9+3); out.set(p[2], i*9+6);
    }
    geo.chunks.push(out);
  } else {
    const text = new TextDecoder().decode(buf);
    const re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g;
    const v = []; let mt;
    while ((mt = re.exec(text))) v.push(+mt[1], +mt[2], +mt[3]);
    const n = Math.floor(v.length/9);
    if (!n) throw new Error("STL에서 삼각형을 찾지 못했습니다.");
    const out = new Float32Array(v.slice(0, n*9));
    for (let i=0;i<n;i++){
      const a=[v[i*9],v[i*9+1],v[i*9+2]], b=[v[i*9+3],v[i*9+4],v[i*9+5]], c=[v[i*9+6],v[i*9+7],v[i*9+8]];
      vol += triStats(geo, a, b, c);
    }
    geo.chunks.push(out);
  }
  geo.vol = Math.abs(vol);
  return geo;
}

/* ---------------- ZIP (3MF) ---------------- */
async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength-22; i >= Math.max(0, buf.byteLength-65557); i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error("3MF(zip) 파일 구조를 읽을 수 없습니다.");
  let count = dv.getUint16(eocd+10, true), cdOff = dv.getUint32(eocd+16, true);
  if (cdOff === 0xFFFFFFFF || count === 0xFFFF){          // ZIP64
    const loc = eocd - 20;
    if (dv.getUint32(loc, true) === 0x07064b50){
      const z = Number(dv.getBigUint64(loc+8, true));
      count = Number(dv.getBigUint64(z+32, true));
      cdOff = Number(dv.getBigUint64(z+48, true));
    }
  }
  const files = {};
  const dec = new TextDecoder();
  let p = cdOff;
  for (let i=0;i<count;i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p+10, true);
    let csize = dv.getUint32(p+20, true), usize = dv.getUint32(p+24, true);
    const nl = dv.getUint16(p+28, true), el = dv.getUint16(p+30, true), cl = dv.getUint16(p+32, true);
    let lo = dv.getUint32(p+42, true);
    const name = dec.decode(u8.subarray(p+46, p+46+nl));
    // ZIP64 extra
    let e = p+46+nl; const eEnd = e+el;
    while (e+4 <= eEnd){
      const id = dv.getUint16(e, true), sz = dv.getUint16(e+2, true);
      if (id === 0x0001){
        let q = e+4;
        if (usize === 0xFFFFFFFF){ usize = Number(dv.getBigUint64(q, true)); q += 8; }
        if (csize === 0xFFFFFFFF){ csize = Number(dv.getBigUint64(q, true)); q += 8; }
        if (lo === 0xFFFFFFFF){ lo = Number(dv.getBigUint64(q, true)); }
      }
      e += 4+sz;
    }
    files[name] = {method, csize, lo};
    p = eEnd + cl;
  }
  async function get(name){
    const f = files[name]; if (!f) return null;
    const nl = dv.getUint16(f.lo+26, true), el = dv.getUint16(f.lo+28, true);
    const start = f.lo + 30 + nl + el;
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return data;
    if (f.method !== 8) throw new Error("지원하지 않는 압축 방식입니다.");
    if (typeof DecompressionStream === "undefined") throw new Error("이 브라우저는 3MF 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge/Safari를 사용하세요.");
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  return {names: Object.keys(files), get, text: async n => { const d = await get(n); return d ? dec.decode(d) : null; }};
}

/* ---------------- 3MF ---------------- */
async function parse3MF(buf){
  const zip = await readZip(buf);
  const result = {};

  // 1) 뱀부 스튜디오 슬라이싱 정보
  const si = zip.names.find(n => /slice_info\.config$/i.test(n));
  if (si){
    const xml = await zip.text(si);
    let sec = 0, g = 0, plates = 0;
    for (const plate of xml.split(/<plate[\s>]/).slice(1)){
      const pr = plate.match(/key="prediction"\s+value="([\d.]+)"/);
      const wt = plate.match(/key="weight"\s+value="([\d.]+)"/);
      if (pr || wt){ plates++; sec += pr ? +pr[1] : 0; g += wt ? +wt[1] : 0; }
    }
    if (sec > 0 || g > 0) result.sliced = {sec, g, plates, source: "뱀부 스튜디오 slice_info"};
  }
  // 2) 내부 G-code 헤더 (slice_info가 없을 때)
  if (!result.sliced){
    const gc = zip.names.filter(n => /\.gcode$/i.test(n));
    let sec = 0, g = 0;
    for (const n of gc){
      const d = await zip.get(n);
      const r = parseGcodeText(gcodeHeadTail(d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength)));
      sec += r.sec || 0; g += r.g || 0;
    }
    if (sec > 0 || g > 0) result.sliced = {sec, g, plates: gc.length, source: "내장 G-code"};
  }

  // 3) 메쉬
  const modelNames = zip.names.filter(n => /\.model$/i.test(n));
  if (modelNames.length){
    const docs = {};
    for (const n of modelNames){
      const t = await zip.text(n);
      docs["/" + n.replace(/^\//, "")] = new DOMParser().parseFromString(t, "application/xml");
    }
    const rootName = Object.keys(docs).find(k => /^\/3D\/3dmodel\.model$/i.test(k)) || Object.keys(docs)[0];
    const geo = newGeo();
    const objIndex = {};
    for (const [path, doc] of Object.entries(docs)){
      const unit = (doc.documentElement.getAttribute("unit") || "millimeter").toLowerCase();
      const scale = {micron:0.001, millimeter:1, centimeter:10, inch:25.4, foot:304.8, meter:1000}[unit] || 1;
      for (const o of doc.getElementsByTagNameNS("*", "object")) objIndex[path + "#" + o.getAttribute("id")] = {o, scale};
    }
    const meshCache = {};
    function meshOf(key){
      if (key in meshCache) return meshCache[key];
      const {o, scale} = objIndex[key];
      const mesh = [...o.children].find(c => c.localName === "mesh");
      if (!mesh){ meshCache[key] = null; return null; }
      const vs = mesh.getElementsByTagNameNS("*", "vertex"), ts = mesh.getElementsByTagNameNS("*", "triangle");
      const pos = new Float64Array(vs.length*3), idx = new Uint32Array(ts.length*3);
      for (let i=0;i<vs.length;i++){
        pos[i*3] = +vs[i].getAttribute("x")*scale; pos[i*3+1] = +vs[i].getAttribute("y")*scale; pos[i*3+2] = +vs[i].getAttribute("z")*scale;
      }
      for (let i=0;i<ts.length;i++){
        idx[i*3] = +ts[i].getAttribute("v1"); idx[i*3+1] = +ts[i].getAttribute("v2"); idx[i*3+2] = +ts[i].getAttribute("v3");
      }
      return meshCache[key] = {pos, idx};
    }
    const pathAttr = el => { for (const a of el.attributes) if (a.localName === "path") return a.value; return null; };
    function walk(key, mtx, depth){
      if (!objIndex[key] || depth > 16) return;
      const {o} = objIndex[key];
      const m = meshOf(key);
      if (m) addMesh(geo, m.pos, m.idx, mtx);
      const comps = [...o.children].find(c => c.localName === "components");
      if (comps) for (const c of comps.children){
        if (c.localName !== "component") continue;
        const p = pathAttr(c) || key.split("#")[0];
        walk(p + "#" + c.getAttribute("objectid"), mul(parseT(c.getAttribute("transform")), mtx), depth+1);
      }
    }
    const items = [...docs[rootName].getElementsByTagNameNS("*", "item")];
    if (items.length){
      for (const it of items){
        if (it.getAttribute("printable") === "0") continue;
        walk((pathAttr(it) || rootName) + "#" + it.getAttribute("objectid"), parseT(it.getAttribute("transform")), 0);
      }
    } else {
      for (const k of Object.keys(objIndex)) if (k.startsWith(rootName)) walk(k, null, 0);
    }
    if (geo.tris) result.geo = geo;
  }
  return result;
}
// 3MF 변환: "m00 m01 m02 m10 m11 m12 m20 m21 m22 m30 m31 m32"
function parseT(s){
  if (!s) return [1,0,0, 0,1,0, 0,0,1, 0,0,0];
  const v = s.trim().split(/\s+/).map(Number);
  return v.length === 12 ? v : [1,0,0, 0,1,0, 0,0,1, 0,0,0];
}
// 먼저 A, 다음 B를 적용하는 합성 변환
function mul(A, B){
  if (!B) return A;
  const r = new Array(12);
  for (let i=0;i<4;i++) for (let j=0;j<3;j++){
    r[i*3+j] = A[i*3]*B[j] + A[i*3+1]*B[3+j] + A[i*3+2]*B[6+j] + (i===3 ? B[9+j] : 0);
  }
  return r;
}

/* ---------------- G-code ---------------- */
function gcodeHeadTail(buf){
  const u8 = new Uint8Array(buf), N = 400000, dec = new TextDecoder();
  if (u8.length <= N*2) return dec.decode(u8);
  return dec.decode(u8.subarray(0, N)) + "\n" + dec.decode(u8.subarray(u8.length - N));
}
function parseDuration(s){
  let sec = 0, m;
  const re = /([\d.]+)\s*([dhms])/g;
  while ((m = re.exec(s))) sec += +m[1] * {d:86400, h:3600, m:60, s:1}[m[2]];
  return sec;
}
function parseGcodeText(t){
  let sec = 0, g = 0, m;
  if ((m = t.match(/total estimated time:\s*([^;\n]+)/i))) sec = parseDuration(m[1]);
  else if ((m = t.match(/estimated printing time \(normal mode\)\s*=\s*([^\n]+)/i))) sec = parseDuration(m[1]);
  else if ((m = t.match(/model printing time:\s*([^;\n]+)/i))) sec = parseDuration(m[1]);
  else if ((m = t.match(/;\s*TIME:\s*(\d+)/))) sec = +m[1];
  if ((m = t.match(/total filament weight \[g\]\s*[:=]\s*([\d.]+)/i))) g = +m[1];
  else if ((m = t.match(/filament used \[g\]\s*[:=]\s*([\d.,\s]+)/i))) g = m[1].split(",").reduce((a,b)=>a+(parseFloat(b)||0),0);
  else if ((m = t.match(/;\s*Filament used:\s*([\d.]+)\s*m/i))){
    const L = +m[1]*1000; // mm, 1.75mm 필라멘트 기준
    g = Math.PI*0.875*0.875*L/1000 * (optData("mat").d || 1.24);
  }
  return {sec, g, plates: 1, source: "G-code 헤더"};
}

FD.analyzeFile = async file => {
  const lower = file.name.toLowerCase();
  if (file.size > 150 * 1024 * 1024) return {name: file.name, error: "파일이 너무 커요 (최대 150MB)", code: "too_large"};
  if (!/\.(stl|3mf|gcode|gco|g)$/.test(lower)) return {name: file.name, error: "지원하지 않는 형식이에요. STL·3MF·G-code만 자동 견적돼요.", code: "unsupported"};
  try{
    const buf = await file.arrayBuffer();
    let r;
    if (lower.endsWith(".stl")) r = {geo: parseSTL(buf)};
    else if (lower.endsWith(".3mf")) r = await parse3MF(buf);
    else r = {sliced: parseGcodeText(gcodeHeadTail(buf))};
    if (r.sliced && !(r.sliced.g > 0 || r.sliced.sec > 0)) r.sliced = null;
    if (!r.geo && !r.sliced) throw new Error("no data");
    const m = {name: file.name, size: file.size, file, ...r};
    if (m.geo){ m.dims = m.geo.max.map((v, i) => v - m.geo.min[i]); m.vol = m.geo.vol / 1000; }
    return m;
  }catch(e){
    console.warn(e);
    return {name: file.name, error: "파일을 해석하지 못했어요. 파일이 손상됐거나 내보내기 방식이 달라요.", code: "parse_fail"};
  }
};

    const s = model.sliced;
    if (s.g > 0) g = s.g * qty;
    if (s.sec > 0) min = Math.ceil(s.sec * qty / 60);
    if (!(s.g > 0) && model.geo){ ENGINE_OPTV = engineFor(o); g = estimate(model.geo).g * qty; }
    notes.push("슬라이싱된 파일이라 파일 속 출력 설정으로 계산했어요.");
  } else {
    ENGINE_OPTV = engineFor(o);
    const e = estimate(model.geo);
    g = e.g * qty; min = Math.ceil(e.min * qty);
  }
  g = +g.toFixed(2);
  if (model.dims){
    const big = Math.max(...model.dims);
    if (big > S.maxSize) return {kind: "reject", reasons: [`가장 긴 변이 ${big.toFixed(0)}mm예요. 최대 ${S.maxSize}mm까지 받을 수 있어요.`], lines: [], notes: ["모델을 줄이거나 나눠서 올려 주세요."]};
    if (big > S.printerMax) reasons.push(`가장 긴 변 ${big.toFixed(0)}mm — 프린터 출력 범위(${S.printerMax}mm)를 넘어 분할 출력을 검토해야 해요.`);
  }
  if (qty > S.review.maxQty) reasons.push(`수량 ${qty}개 — 대량 주문은 일정과 단가를 따로 확인해요.`);
  if (g > S.review.maxGram) reasons.push(`예상 무게 ${Math.round(g)}g — 대형 출력이라 출력 방향·분할을 확인해요.`);
  if (o.color === "기타") reasons.push("기타 색상 — 가능한 색상을 확인한 뒤 안내해요.");
  if (!(g > 0)) reasons.push("무게를 계산하지 못했어요.");
  const total = FD.printPrice(o.mat, g, min);
  const final = student ? total * (1 - S.studentRate) : total;
  const lines = [{label: `출력비 (${qty}개)`, amount: total}];
  if (student) lines.push({label: `학생 할인 ${Math.round(S.studentRate * 100)}%`, amount: final - total});
  return {kind: reasons.length ? "review" : "auto", g, total: final, before: total, lines, reasons, notes, qty};
};

// 모델링 의뢰 자동 견적: 예상 작업 시간 → 디자인비 (기본 1시간 포함, 초과 30분마다 추가 — 운영 규칙)

FD.designFee = (svc, minutes) => {
  const S = FD.settings, base = S.design[svc] || 0;
  return base + Math.ceil(Math.max(0, minutes - S.baseMin) / S.stepMin) * S.stepFee;
};
FD.quoteDesign = (svc, v, student) => {
  const S = FD.settings, reasons = [], notes = [];
  let min = 0;
  if (svc === "modify"){
    const sc = FD.MOD_SCOPE.find(x => x[0] === v.scope);
    if (!sc) return {kind: "empty"};
    if (sc[2] == null) reasons.push("대부분 다시 설계 — 새로 모델링하는 범위라 담당자가 확인해요."); else min = sc[2];
  } else {
    const cx = FD.COMPLEXITY.find(x => x[0] === v.complexity);
    if (!cx) return {kind: "empty"};
    if (cx[3] == null) reasons.push("형태 난이도를 정하지 않으셨어요. 담당자가 자료를 보고 정해요."); else min = cx[3];
    if (svc === "pro") min += Math.max(0, (parseInt(v.parts) || 1) - 1) * (FD.PART_MIN ?? 30);
  }
  for (const f of FD.FEATURES) if ((v.features || []).includes(f[0])) min += f[2];
  const desc = String(v.desc || "").trim();
  if ((svc === "idea" || svc === "pro") && desc.length < S.review.minDescLen) reasons.push("설명이 짧아요. 만들 물건을 조금 더 알려 주시면 바로 견적이 나와요.");
  if (min > S.review.maxDesignMin) reasons.push(`예상 작업 시간이 ${Math.round(min / 60)}시간을 넘어 일정·범위를 확인해요.`);
  // 의뢰 출력: 지금은 디자인 기본비(1시간 포함)만 결제 → 디자인 후 시간이 넘으면 추가 비용 → 완성 파일로 'STL 파일이 있어요' 출력 주문
  const fee = FD.designFee(svc, min), base = S.design[svc] || 0, k = student ? 1 - S.studentRate : 1;
  const lines = [{label: `디자인 기본비 (${fmtMin(S.baseMin)} 포함)`, amount: base * k}];
  if (fee > base) lines.push({label: `예상 추가 비용 (예상 작업 ${fmtMin(min)}, 나중에 결제)`, amount: (fee - base) * k});
  if (student) lines.push({label: `학생 할인 ${Math.round(S.studentRate * 100)}% 적용`, amount: 0});
  notes.push(`디자인 시간이 ${fmtMin(S.baseMin)}을 넘으면 ${S.stepMin}분마다 ${won(S.stepFee * k)}의 추가 비용이 생길 수 있어요. 추가 비용은 디자인이 끝난 뒤 알려 드리고 따로 결제해요.`);
  notes.push("출력비는 여기 포함되지 않아요. 완성 파일을 보내 드리면 그 파일로 'STL 파일이 있어요'에서 출력을 주문해요.");
  return {kind: reasons.length ? "review" : "auto", payNow: true, total: base * k, est: fee * k, before: base, minutes: min, lines, reasons, notes};
};
function fmtMin(m){ const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; }

/* ---------------- 폼 그리기·읽기 (모든 시안 공통 컴포넌트) ---------------- */
const fieldId = (p, id) => `${p}-${id}`;

  const id = fieldId(p, f.id), v = val ?? f.def ?? "";

  if (f.type === "text" || f.type === "tel") c = `<input class="fd-in" id="${id}" type="${f.type}" ${f.type === "tel" ? 'inputmode="tel" autocomplete="tel"' : ""} ${f.auto ? `autocomplete="${f.auto}"` : ""} maxlength="200" placeholder="${esc(f.ph || "")}" value="${esc(v)}">`;
  else if (f.type === "textarea") c = `<textarea class="fd-in" id="${id}" maxlength="3000" rows="4" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>`;
  else if (f.type === "number") c = `<input class="fd-in fd-num" id="${id}" type="number" inputmode="numeric" min="${f.min}" max="${f.max}" value="${esc(v || f.def)}">`;
  else if (f.type === "select") c = `<select class="fd-in" id="${id}">${f.options.map(([k, t]) => `<option value="${k}"${k === (v || f.def) ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
  else if (f.type === "dims") c = `<div class="fd-dims" id="${id}">${["가로","세로","높이"].map((t, i) => `<input class="fd-in" type="number" inputmode="decimal" min="1" max="300" placeholder="${t}" aria-label="${t} mm" value="${esc((v || [])[i] || "")}">`).join('<span>×</span>')}</div>`;
  else if (f.type === "chips" || f.type === "radio") c = `<div class="fd-${f.type === "chips" ? "chips" : "radios"}" id="${id}" role="radiogroup">${f.options.map(([k, t, d]) =>
      `<button type="button" role="radio" class="fd-opt${k === (v || f.def) ? " on" : ""}" aria-checked="${k === (v || f.def)}" data-v="${k}"><b>${esc(t)}${f.type === "radio" ? FD.helpBtn(f.id, k) : ""}</b>${d ? `<small>${esc(d)}</small>` : ""}</button>`).join("")}</div>${f.type === "chips" ? FD.helpAll(f.id) : ""}`;
  else if (f.type === "checks") c = `<div class="fd-chips" id="${id}">${f.options.map(([k, t]) => `<button type="button" class="fd-opt${(v || []).includes(k) ? " on" : ""}" aria-pressed="${(v || []).includes(k)}" data-v="${k}"><b>${esc(t)}</b></button>`).join("")}</div>${FD.helpAll(f.id)}`;
  else if (f.type === "files") c = `<label class="fd-drop" for="${id}">${FD.icon("upload")}<span><b>눌러서 고르거나 끌어다 놓기</b><small>${esc(f.help || "")}</small></span></label>
      <input id="${id}" type="file" accept="${f.accept || ""}" multiple hidden><div class="fd-flist" data-for="${id}"></div>`;
  const on = Array.isArray(v) ? v.includes("etc") : v === "etc";
  if (hasEtc(f)) c += `<input class="fd-in fd-etc" id="${id}-etc" maxlength="100" placeholder="직접 입력해 주세요" value="${esc(etcVal || "")}"${on ? "" : " hidden"} aria-label="${esc(f.label)} 직접 입력">`;

FD.formHTML = (fields, p, vals = {}) => fields.map(f => FD.fieldHTML(f, p, vals[f.id], vals[f.id + "_etc"])).join("");
const FILES = FD.FILES = {};      // 화면에서 고른 파일 (데모: 이름·크기만 저장 · 실제 모드: 함께 전송)
FD.bindForm = (root, onChange) => {
  root.addEventListener("click", e => {
    const b = e.target.closest(".fd-opt"); if (!b || !root.contains(b)) return;
    const box = b.parentElement, fld = b.closest(".fd-field");
    if (fld.dataset.type === "checks"){ b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); }
    else box.querySelectorAll(".fd-opt").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-checked", x === b); });
    const etc = fld.querySelector(".fd-etc");
    if (etc){ const show = !!fld.querySelector('.fd-opt.on[data-v="etc"]'); etc.hidden = !show; if (show && b.dataset.v === "etc") etc.focus(); }
    clearErr(fld); onChange && onChange();
  });
  root.addEventListener("input", e => { const fld = e.target.closest(".fd-field"); if (fld) clearErr(fld); onChange && onChange(); });
  root.querySelectorAll('.fd-field[data-type="files"]').forEach(fld => {
    const inp = fld.querySelector("input[type=file]"), drop = fld.querySelector(".fd-drop"), list = fld.querySelector(".fd-flist");
    const add = fl => { FILES[inp.id] = [...(FILES[inp.id] || []), ...fl].slice(0, 10); draw(); clearErr(fld); onChange && onChange(); };
    const draw = () => { list.innerHTML = (FILES[inp.id] || []).map((f, i) => `<span class="fd-file">${esc(f.name)} <small>${(f.size / 1048576).toFixed(1)}MB</small><button type="button" data-i="${i}" aria-label="${esc(f.name)} 빼기">×</button></span>`).join(""); };
    inp.onchange = () => { add([...inp.files]); inp.value = ""; };

    ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", e => add([...e.dataTransfer.files]));
    list.onclick = e => { const b = e.target.closest("button[data-i]"); if (!b) return; FILES[inp.id].splice(+b.dataset.i, 1); draw(); onChange && onChange(); };
    draw();
  });
};
const clearErr = fld => { fld.classList.remove("bad"); const e = fld.querySelector(".fd-err"); if (e){ e.hidden = true; e.textContent = ""; } };
FD.readForm = (root, fields, p) => {
  const v = {};

    const id = fieldId(p, f.id), el = document.getElementById(id);
    if (!el) continue;
    if (f.type === "dims") v[f.id] = [...el.querySelectorAll("input")].map(i => i.value);
    else if (f.type === "chips" || f.type === "radio"){ const on = el.querySelector(".fd-opt.on"); v[f.id] = on ? on.dataset.v : ""; }
    else if (f.type === "checks") v[f.id] = [...el.querySelectorAll(".fd-opt.on")].map(b => b.dataset.v);
    else if (f.type === "files") v[f.id] = (FILES[id] || []).map(x => ({name: x.name, size: x.size}));
    else v[f.id] = el.value.trim();
    if (hasEtc(f)){ const e = document.getElementById(id + "-etc"); v[f.id + "_etc"] = e ? e.value.trim() : ""; }   // '기타' 직접 입력

FD.validate = (root, fields, p) => {
  const v = FD.readForm(root, fields, p); let first = null;
  for (const f of fields){
    const fld = root.querySelector(`.fd-field[data-fid="${f.id}"]`); if (!fld) continue;
    let msg = "";
    const x = v[f.id];
    if (f.req && (x == null || x === "" || (Array.isArray(x) && (f.type === "dims" ? !x.some(n => +n > 0) : !x.length)))) msg = f.type === "files" ? "파일을 하나 이상 올려 주세요." : f.type === "radio" ? "하나를 골라 주세요." : "꼭 적어 주세요.";
    else if (f.type === "tel" && x && !/^01[016789]-?\d{3,4}-?\d{4}$/.test(x.replace(/\s/g, ""))) msg = "휴대폰 번호 형식을 확인해 주세요. (예: 010-1234-5678)";
    else if (f.type === "dims" && x.some(n => n && (+n <= 0 || +n > FD.settings.maxSize))) msg = `한 변은 1~${FD.settings.maxSize}mm로 적어 주세요.`;
    else if (hasEtc(f) && (Array.isArray(x) ? x.includes("etc") : x === "etc") && !v[f.id + "_etc"]) msg = "기타 내용을 직접 적어 주세요.";

  }

  return first ? null : v;
};

  return `<div class="fd-quote ${review ? "review" : "auto"}" role="status">

    ${review ? `<div class="fd-q-why"><b>담당자가 확인하는 이유</b>${q.reasons.map(r => `<p>${esc(r)}</p>`).join("")}<p class="fd-q-note">주문은 지금 접수돼요. 확인이 끝나면 확정 금액을 문자·사이트로 알려 드려요.</p></div>` : ""}
    ${q.notes.map(n => `<p class="fd-q-note">${esc(n)}</p>`).join("")}
    <p class="fd-q-note">${review ? "" : q.payNow ? "" : "예상 금액이에요. 실제 출력 조건 확인 후 달라질 수 있어요. "}결제는 네이버 스마트스토어에서 해요.</p></div>`;

/* ---------------- 3D 미리보기 (회전·확대·처음 시점) ---------------- */
FD.Viewer = class {
  constructor(canvas, opt = {}){
    this.cv = canvas; this.ctx = canvas.getContext("2d"); this.bg = opt.bg; this.grid = opt.grid || "rgba(128,140,160,.18)";

      if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 2){ const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) this.zoom = Math.min(6, Math.max(.3, this.zoom * d / pinch)); pinch = d; this.draw(); return; }

    });

    canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);

    requestAnimationFrame(tick);
  }
  reset(){ this.yaw = -.6; this.pitch = .9; this.zoom = 1; }
  setColor(name){ const h = FD.COLOR_HEX[name] || "#2962ff"; this.color = [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16)); this.draw(); }
  setModel(geo){
    if (!geo){ this.m = null; this.draw(); return; }
    const total = geo.tris, step = Math.max(1, Math.ceil(total / 20000)), tris = []; let n = 0;
    for (const ch of geo.chunks) for (let i = 0; i < ch.length / 9; i++, n++){
      if (n % step) continue;

      const ux = t[3]-t[0], uy = t[4]-t[1], uz = t[5]-t[2], vx = t[6]-t[0], vy = t[7]-t[1], vz = t[8]-t[2];
      let nx = uy*vz-uz*vy, ny = uz*vx-ux*vz, nz = ux*vy-uy*vx; const l = Math.hypot(nx, ny, nz) || 1;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);

    const z0 = m.min[2], g0 = [Math.floor((m.min[0]-10)/10)*10, Math.floor((m.min[1]-10)/10)*10], g1 = [Math.ceil((m.max[0]+10)/10)*10, Math.ceil((m.max[1]+10)/10)*10];

      ctx.strokeStyle = this.grid; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = g0[0]; x <= g1[0]; x += 10){ const a = P(x, g0[1], z0), b = P(x, g1[1], z0); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
      for (let y = g0[1]; y <= g1[1]; y += 10){ const a = P(g0[0], y, z0), b = P(g1[0], y, z0); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
      ctx.stroke();
    }
    const L = [];
    for (const {t, n} of m.tris){
      const a = P(t[0],t[1],t[2]), b = P(t[3],t[4],t[5]), d = P(t[6],t[7],t[8]);
      const vnx = n[0]*cy - n[1]*sy, vy0 = n[0]*sy + n[1]*cy, vny = vy0*cp - n[2]*sp, vnz = vy0*sp + n[2]*cp;
      L.push([a[2]+b[2]+d[2], a, b, d, Math.abs(-.3*vnx - .75*vny + .6*vnz)]);
    }
    L.sort((p, q) => q[0] - p[0]);
    const [r, g, bl] = this.color;
    for (const [, a, b, d, l] of L){
      const k = .45 + .55 * l; ctx.fillStyle = `rgb(${r*k|0},${g*k|0},${bl*k|0})`; ctx.strokeStyle = ctx.fillStyle;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
};
// 치수 상자 (모델링 의뢰에서 원하는 크기를 3D로 보여 줄 때)
FD.boxGeo = (dx, dy, dz) => { const t = [], v = [[0,0,0],[dx,0,0],[dx,dy,0],[0,dy,0],[0,0,dz],[dx,0,dz],[dx,dy,dz],[0,dy,dz]];
  for (const f of [[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]]) t.push(...f.flatMap(i => v[i]));
  const g = newGeo(); g.chunks.push(new Float32Array(t)); g.tris = 12; g.min = [0,0,0]; g.max = [dx,dy,dz]; g.vol = dx*dy*dz; return g; };
// 샘플 STL (데모용 T자 모델: 30×30×25mm) — 파일 없이 흐름을 볼 때
FD.sampleModel = () => {
  const box = (x0, y0, z0, x1, y1, z1) => { const v = [[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
    return [[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]].map(f => f.map(i => v[i])); };
  const tris = [...box(10, 10, 0, 20, 20, 20), ...box(0, 0, 20, 30, 30, 25)];
  const buf = new ArrayBuffer(84 + tris.length * 50), dv = new DataView(buf); dv.setUint32(80, tris.length, true);
  tris.forEach((t, i) => t.forEach((p, k) => p.forEach((c, j) => dv.setFloat32(84 + i * 50 + 12 + k * 12 + j * 4, c, true))));
  const f = new File([buf], "샘플_T브래킷.stl"); return f;
};

/* ---------------- 비회원 주문 조회 (주문번호 + 휴대폰 인증) ----------------
   실서비스 설계: 서버가 (번호, 연락처) 확인 → 6자리 코드 문자 발송 (3분 유효, 5회 실패 시 잠금)
   → 코드 확인 후 짧은 조회 토큰 발급 → 토큰으로 공개 정보만 조회. 데모는 화면에 코드를 보여 줘요. */
let OTP = null;
FD.otpStart = (no, phone) => {
  no = String(no).trim(); const p = normPhone(phone);
  if (!/^\d{4}$/.test(no) || p.length < 10) return {ok: false, msg: "주문번호 4자리와 휴대폰 번호를 확인해 주세요."};
  const o = FD.store.get(no);
  const code = String(Math.floor(100000 + Math.random() * 900000));
  OTP = {no, match: !!(o && o.customer.phone === p), code, exp: Date.now() + 180e3, tries: 0};
  if (OTP.match) FD.notify.send("otp", o, {result: "연동 대기 (보내지 않음) · 코드는 기록하지 않음"});
  // 번호가 틀려도 같은 안내 → 다른 사람 주문이 있는지 알 수 없게
  return {ok: true, msg: "입력하신 번호로 인증번호를 보냈어요. (3분 안에 입력)", demoCode: OTP.match ? code : null};
};
FD.otpVerify = code => {
  if (!OTP) return {ok: false, msg: "인증번호를 먼저 받아 주세요."};
  if (Date.now() > OTP.exp){ OTP = null; return {ok: false, msg: "시간이 지났어요. 인증번호를 다시 받아 주세요."}; }
  if (++OTP.tries > 5){ OTP = null; return {ok: false, msg: "5번 틀려서 잠겼어요. 잠시 뒤 다시 시도해 주세요."}; }
  if (!OTP.match || String(code).trim() !== OTP.code) return {ok: false, msg: `인증번호가 맞지 않아요. (${OTP.tries}/5)`};
  const o = FD.store.get(OTP.no); OTP = null;
  return {ok: true, order: FD.publicView(o)};
};

        <form><input class="fd-in" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4자리" aria-label="관리자 PIN"><button class="fd-btn primary">들어가기</button><div class="fd-err" hidden></div></form></div>`;
      $("form", el).onsubmit = e => { e.preventDefault(); const v = $("input", el).value; if (!/^\d{4}$/.test(v)){ const er = $(".fd-err", el); er.hidden = false; er.textContent = "4자리 숫자를 넣어 주세요."; return; }
        authed = true; sessionStorage.setItem("fdr_admin", "1"); render(); };
      return;
    }
    const all = FD.store.all();
    const cnt = k => all.filter(o => o.status === k).length;
    el.innerHTML = `<div class="fd-adm">
      <div class="fd-adm-top"><b>관리자</b><span class="fd-badge warn">데모 데이터</span><nav class="fd-adm-tabs" role="tablist">${[["orders","주문"],["review","견적 검토"],["settings","가격·설정"],["notify","알림 기록"],["portfolio","포트폴리오"]].map(([k, t]) =>
        `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? "on" : ""}" data-tab="${k}">${t}${k === "review" && cnt("review") ? ` <i>${cnt("review")}</i>` : ""}</button>`).join("")}</nav>

  const ordersView = all => {

      ["제작 중", all.filter(o => o.status === "making").length], ["이번 달 접수", all.filter(o => new Date(o.createdAt).getMonth() === new Date().getMonth()).length]];
    let list = tab === "review" ? all.filter(o => o.status === "review") : all.filter(o => filter === "all" || o.status === filter);
    if (q) list = list.filter(o => [o.no, o.title, o.customer.name, o.customer.phone].join(" ").toLowerCase().includes(q.toLowerCase()));

      <div class="fd-adm-split"><div class="fd-olist">${list.length ? list.map(x => `<button class="fd-orow${x.no === sel ? " on" : ""}" data-no="${x.no}">

          <span class="fd-st ${x.status}">${FD.stLabel(x.status)}</span></button>`).join("") : `<div class="fd-empty">해당하는 주문이 없어요.</div>`}</div>
        <div class="fd-odetail">${o ? detail(o) : `<div class="fd-empty">왼쪽에서 주문을 고르세요.</div>`}</div></div>`;
  };
  const detail = o => `<div class="fd-od-head"><b>#${o.no}</b> <span class="fd-st ${o.status}">${FD.stLabel(o.status)}</span>${o.demo ? ' <span class="fd-badge">샘플</span>' : ""}</div>
    <dl class="fd-od">${[["서비스", FD.svc(o.service)?.name], ["내용", o.title], ["고객", o.customer.name], ["연락처", o.customer.phone.replace(/(\d{3})(\d{3,4})(\d{4})/, "$1-$2-$3")],
      ["견적", o.quote?.total != null ? won(o.quote.total) + (o.quote.kind === "review" ? " (참고)" : " (자동)") : "미정"], ["검토 사유", (o.quote?.reasons || []).join(" / ") || "—"],
      ["고객 요청", o.memoCustomer || "—"], ["학생 할인", o.student ? "적용 (영상 확인)" : "—"]].map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v ?? "—")}</dd></div>`).join("")}</dl>
    ${o.status === "review" ? `<div class="fd-od-box"><label class="fd-label" for="qPrice">확정 금액 (원)</label><div class="fd-row"><input class="fd-in" id="qPrice" type="number" inputmode="numeric" value="${Math.round(o.quote?.total || 0)}"><button class="fd-btn primary" data-act="confirm" data-no="${o.no}">견적 확정</button></div></div>` : ""}
    <div class="fd-od-box"><label class="fd-label" for="stSel">상태 변경</label><div class="fd-row"><select class="fd-in" id="stSel">${FD.STATUS.map(s => `<option value="${s[0]}"${s[0] === o.status ? " selected" : ""}>${s[1]}</option>`).join("")}</select><button class="fd-btn" data-act="status" data-no="${o.no}">저장</button></div>
      <p class="fd-help">'결제 확인'은 스마트스토어에서 결제를 직접 확인한 뒤에 바꿔 주세요. 사이트가 결제를 자동으로 알 수는 없어요.</p></div>
    <div class="fd-od-box"><label class="fd-label" for="memo">내부 메모 <small>(고객에게 안 보여요)</small></label><textarea class="fd-in" id="memo" rows="2">${esc(o.memo || "")}</textarea><button class="fd-btn sm" data-act="memo" data-no="${o.no}">메모 저장</button></div>
    <details class="fd-od-log"><summary>변경 기록 ${o.log.length}건</summary>${o.log.map(l => `<div>${new Date(l.at).toLocaleString("ko-KR")} · ${esc(l.who)} · ${esc(l.act)}</div>`).join("")}</details>
    <button class="fd-btn ghost sm danger" data-act="del" data-no="${o.no}">주문 삭제</button>`;
  const settingsView = () => { const S = FD.settings;
    const num = (path, label, v, unit = "원") => `<label class="fd-set"><span>${label}</span><input class="fd-in" type="number" step="any" data-path="${path}" value="${v}"><em>${unit}</em></label>`;
    return `<p class="fd-help">여기서 바꾼 값은 이 브라우저의 시안에만 적용돼요(데모). 실제 사이트는 기존 관리자 '가격 설정' 화면과 같은 저장소를 쓰게 돼요.</p>
      <h3>필라멘트 1kg 가격</h3><div class="fd-sets">${Object.entries(S.filament).map(([k, v]) => num("filament." + k, k, v)).join("")}</div>
      <h3>출력비 계산</h3><div class="fd-sets">${num("perMin", "분당 기계비", S.perMin)}${num("base", "기본비", S.base)}${num("margin", "마진 배율", S.margin, "배")}</div>
      <h3>디자인비</h3><div class="fd-sets">${num("design.sketch", "손그림 기본", S.design.sketch)}${num("design.idea", "아이디어 기본", S.design.idea)}${num("design.modify", "모델 수정 기본 [제안]", S.design.modify)}${num("design.pro", "전문 모델링 기본 [제안]", S.design.pro)}
        ${num("baseMin", "기본 포함 시간", S.baseMin, "분")}${num("stepMin", "추가 단위", S.stepMin, "분")}${num("stepFee", "단위당 추가", S.stepFee)}${num("studentRate", "학생 할인율", S.studentRate, "(0.15=15%)")}</div>
      <h3>관리자 검토로 넘기는 기준 [제안]</h3><div class="fd-sets">${num("printerMax", "프린터 출력 범위", S.printerMax, "mm")}${num("maxSize", "접수 최대 크기", S.maxSize, "mm")}${num("review.maxQty", "수량 초과", S.review.maxQty, "개")}${num("review.maxGram", "무게 초과", S.review.maxGram, "g")}${num("review.maxDesignMin", "디자인 시간 초과", S.review.maxDesignMin, "분")}${num("review.minDescLen", "설명 최소 글자", S.review.minDescLen, "자")}</div>
      <h3>연결</h3><label class="fd-set wide"><span>스마트스토어 결제 링크</span><input class="fd-in" type="url" data-path="smartstoreUrl" placeholder="https://smartstore.naver.com/상점/products/번호" value="${esc(S.smartstoreUrl)}"></label>
      <div class="fd-row" style="margin-top:14px"><button class="fd-btn primary" data-act="saveSet">저장</button><button class="fd-btn ghost" data-act="resetSet">기본값</button></div>`; };
  const notifyView = () => `<div class="fd-chan">${FD.notify.channels.map(c => `<div class="fd-chan-i"><b>${esc(c.name)}</b><span class="fd-badge ${c.state === "test" ? "" : "warn"}">${c.state === "test" ? "테스트 모드" : "연동 필요"}</span><small>${esc(c.note)}</small></div>`).join("")}</div>
    <h3>발송 기록</h3>${FD.notify.log().length ? `<div class="fd-nlog">${FD.notify.log().map(l => `<div><span>${new Date(l.at).toLocaleString("ko-KR")}</span><b>#${l.no}</b><span>${esc(l.event)}</span><span>${esc(l.channel)} → ${esc(l.to)}</span><em>${esc(l.result)}</em></div>`).join("")}</div>` : `<div class="fd-empty">아직 기록이 없어요.</div>`}`;
  const pfView = () => `<p class="fd-help">기존 관리자의 포트폴리오 관리(사진·제목·설명 등록, 순서)는 그대로 유지해요. 아래는 표시 예시예요.</p>
    <div class="fd-pfadm">${FD.PORTFOLIO.map(p => `<div><img src="${p.img}" alt=""><b>${esc(p.t)}</b><small>${esc(p.d)} · ${FD.SAMPLE_TAG}</small></div>`).join("")}</div>`;
  el.addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if (t){ tab = t.dataset.tab; sel = null; render(); return; }
    const f = e.target.closest("[data-filter]"); if (f){ filter = f.dataset.filter; render(); return; }
    const r = e.target.closest(".fd-orow"); if (r){ sel = r.dataset.no; render(); return; }
    const a = e.target.closest("[data-act]"); if (!a) return;
    const no = a.dataset.no, act = a.dataset.act;
    if (act === "logout"){ authed = false; sessionStorage.removeItem("fdr_admin"); render(); }
    else if (act === "status"){ const v = $("#stSel", el).value; FD.store.update(no, {status: v}, "관리자", `상태 → ${FD.stLabel(v)}`); FD.notify.send("status_" + v, FD.store.get(no)); render(); }
    else if (act === "confirm"){ const p = +$("#qPrice", el).value; if (!(p > 0)) return; const o = FD.store.get(no);
      FD.store.update(no, {status: "pay_wait", quote: {...o.quote, kind: "confirmed", total: p}}, "관리자", `견적 확정 ${won(p)}`); FD.notify.send("quote_confirmed", FD.store.get(no)); render(); }
    else if (act === "memo"){ FD.store.update(no, {memo: $("#memo", el).value}, "관리자", "내부 메모 수정"); render(); }
    else if (act === "del"){ if (confirm(`#${no} 주문을 지울까요? (데모 데이터)`)){ FD.store.remove(no); sel = null; render(); } }
    else if (act === "saveSet"){ const S = structuredClone(FD.settings);
      $$("[data-path]", el).forEach(i => { const ks = i.dataset.path.split("."), last = ks.pop(); let o = S; for (const k of ks) o = o[k]; o[last] = i.type === "number" ? +i.value : i.value.trim(); });
      if (S.smartstoreUrl && !/^https:\/\/(smartstore|brand)\.naver\.com\//.test(S.smartstoreUrl)){ alert("스마트스토어 주소(https://smartstore.naver.com/…)만 넣을 수 있어요."); return; }
      FD.saveSettings(S); opt.onSettings && opt.onSettings(); FD.toast("저장했어요"); render(); }
    else if (act === "resetSet"){ FD.saveSettings(structuredClone(DEF)); localStorage.removeItem("fdr_settings"); opt.onSettings && opt.onSettings(); render(); }
  });
  el.addEventListener("input", e => { if (e.target.dataset.act === "q"){ q = e.target.value; const pos = e.target.selectionStart; render(); const i = $('[data-act="q"]', el); i.focus(); i.setSelectionRange(pos, pos); } });
  render();
};

/* ---------------- 학생 할인 (5초 이상 영상 확인 — 운영 기능) ---------------- */
FD.videoSeconds = file => new Promise(res => {
  const v = document.createElement("video"), url = URL.createObjectURL(file); let done = false;
  const fin = x => { if (done) return; done = true; URL.revokeObjectURL(url); res(x); };
  v.preload = "metadata"; v.muted = true; v.onloadedmetadata = () => fin(isFinite(v.duration) ? v.duration : null); v.onerror = () => fin(null); setTimeout(() => fin(null), 6000); v.src = url;
});
FD.studentHTML = p => `<div class="fd-stu"><label class="fd-switch"><input type="checkbox" id="${p}-stu"><span></span><b>학생이에요 · ${Math.round(FD.settings.studentRate * 100)}% 할인</b></label>
  <div class="fd-stu-body" hidden><p class="fd-help">학생증이 보이게 ${FD.settings.studentMinSec}초 이상 찍은 영상을 올려 주세요. 판매자만 봐요.</p>
  <label class="fd-drop sm" for="${p}-stuv">${FD.icon("upload")}<span><b>영상 올리기</b></span></label><input type="file" id="${p}-stuv" accept="video/*" hidden><div class="fd-stu-st" role="status"></div></div></div>`;
FD.bindStudent = (p, onChange) => {
  const cb = document.getElementById(p + "-stu"), body = cb.closest(".fd-stu").querySelector(".fd-stu-body"), st = body.querySelector(".fd-stu-st"), inp = document.getElementById(p + "-stuv");
  const S = FD.lastStudent = {on: false, ok: false, file: null};
  cb.onchange = () => { S.on = cb.checked; body.hidden = !S.on; onChange(S.on && S.ok); };
  inp.onchange = async () => { const f = inp.files[0]; inp.value = ""; if (!f) return; st.textContent = "영상 길이 확인 중…";
    const sec = await FD.videoSeconds(f); S.ok = sec == null || sec >= FD.settings.studentMinSec; S.file = S.ok ? f : null;
    st.textContent = S.ok ? `확인됐어요${sec ? ` (${sec.toFixed(1)}초)` : ""} · 할인 적용` : `${sec.toFixed(1)}초예요. ${FD.settings.studentMinSec}초 이상 영상을 올려 주세요.`; st.className = "fd-stu-st " + (S.ok ? "ok" : "bad"); onChange(S.on && S.ok); };
  return S;
};
FD.consentHTML = p => `<label class="fd-consent"><input type="checkbox" id="${p}-consent"><span><b>[필수]</b> 개인정보 수집·이용 동의 <small>이름·휴대폰 번호·첨부 파일 / 주문 처리·안내 목적 / 주문 완료 후 1년 보관</small></span></label><div class="fd-err" id="${p}-consent-err" hidden>동의해야 주문할 수 있어요.</div>`;
FD.checkConsent = p => { const ok = document.getElementById(p + "-consent").checked; document.getElementById(p + "-consent-err").hidden = ok; return ok; };
