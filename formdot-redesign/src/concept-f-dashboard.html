<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORMDOT · F 대시보드</title>
<meta name="theme-color" content="#1a1b1f">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<!--@@CORE_CSS@@-->
<style>
/* ===== F · Dashboard First — 앱 셸. 내 주문 상태·빠른 견적·다시 주문이 첫 화면 ===== */
:root{--fd-bg:#1a1b1f;--fd-surface:#232429;--fd-surface2:#1e1f23;--fd-line:#33353c;--fd-muted:#9ea2ab;--fd-r:16px;--fd-r-sm:11px;--side:232px}
body{margin:0;background:var(--fd-bg);color:var(--fd-text);font-family:var(--fd-font);-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--fd-line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;background:#17181b}
.side .fd-logo{font-size:15px;padding:4px 10px 20px;text-decoration:none}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--fd-muted);text-decoration:none;font-weight:600;font-size:14.5px}
.side a .fd-ic{width:20px;height:20px}.side a.on{background:var(--fd-surface);color:var(--fd-text)}.side a:hover{color:var(--fd-text)}
.side a .cnt{margin-left:auto;background:var(--fd-accent);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.side .new{margin:6px 0 14px;justify-content:center;background:var(--fd-accent);color:#fff!important}
.side .bottom{margin-top:auto;font-size:12.5px;color:var(--fd-muted);padding:10px}
.main{padding:26px 32px 100px;min-width:0}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:22px}.hd h1{font-size:24px;letter-spacing:-.02em;margin:0}.hd .r{margin-left:auto;display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--fd-surface);border:1px solid var(--fd-line);border-radius:var(--fd-r);padding:18px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.card h2 small{margin-left:auto;font-weight:500;color:var(--fd-muted);font-size:12.5px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c12{grid-column:span 12}.c6{grid-column:span 6}
.qq{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qq .zone{border:1.5px dashed var(--fd-line);border-radius:14px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;padding:14px;position:relative;overflow:hidden}
.qq .zone.over{border-color:var(--fd-accent);background:var(--fd-accent-soft)}.qq .zone .fd-ic{width:30px;height:30px;color:var(--fd-accent-text)}.qq .zone small{color:var(--fd-muted)}
.qq .zone canvas{position:absolute;inset:0;width:100%;height:100%}
.qq .zone .zi{position:relative;z-index:1}
.qq .res{display:flex;flex-direction:column;gap:10px}
.mini-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-opts select{min-height:40px;padding:8px 10px;font-size:14px}
.big-price{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ord{display:grid;gap:10px}
.oc{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;border-radius:13px;background:var(--fd-surface2);border:1px solid var(--fd-line)}
.oc .t{min-width:0}.oc .t b{font-variant-numeric:tabular-nums}.oc .t span{display:block;color:var(--fd-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .acts{display:flex;gap:6px;align-items:flex-start}
.oc .fd-steps{grid-column:1/-1}
.svc-tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.svc-tiles button{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:13px;border:1px solid var(--fd-line);background:var(--fd-surface2);color:inherit;font:inherit;cursor:pointer;text-align:left}
.svc-tiles button:hover{border-color:var(--fd-accent)}.svc-tiles .fd-ic{width:24px;height:24px;color:var(--fd-accent-text)}.svc-tiles b{font-size:14px}.svc-tiles small{color:var(--fd-muted);font-size:12px}
.feed{display:grid;gap:8px;font-size:13.5px}.feed div{display:flex;gap:10px;align-items:baseline}.feed time{color:var(--fd-muted);font-size:12px;min-width:76px}
.form2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.form2 .stick{position:sticky;top:20px;display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}.tabs button{border:1px solid var(--fd-line);background:transparent;color:var(--fd-muted);border-radius:99px;padding:9px 14px;font:600 14px var(--fd-font);cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button .fd-ic{width:16px;height:16px}.tabs button.on{background:var(--fd-text);color:var(--fd-bg);border-color:var(--fd-text)}
.sub-h{font-size:13px;color:var(--fd-muted);font-weight:700;margin:22px 0 10px;letter-spacing:.04em}
.view{height:240px;position:relative;border-radius:13px;background:var(--fd-surface2);border:1px solid var(--fd-line);margin-top:10px}.view canvas{position:absolute;inset:0;width:100%;height:100%}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pf{border-radius:14px;overflow:hidden;background:var(--fd-surface);border:1px solid var(--fd-line);text-align:left;padding:0;color:inherit;font:inherit;cursor:pointer}.pf img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.pf div{padding:12px}.pf small{display:block;color:var(--fd-muted)}
.tabbar{display:none}
.empty-hero{text-align:center;padding:26px 10px}.empty-hero b{display:block;font-size:17px;margin-bottom:4px}.empty-hero p{color:var(--fd-muted);margin:0 0 14px}
@media (max-width:1100px){.c8,.c4,.c6{grid-column:span 12}.svc-tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .main{padding:16px 14px 110px}.hd h1{font-size:21px}.hd .r .fd-btn span:not(.fd-ic){display:none}
  .qq{grid-template-columns:1fr}.qq .zone{min-height:150px}
  .svc-tiles{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:42%;overflow-x:auto;scrollbar-width:none}
  .form2{grid-template-columns:minmax(0,1fr)}.form2 .stick{position:static}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(23,24,27,.96);backdrop-filter:blur(10px);border-top:1px solid var(--fd-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--fd-muted);text-decoration:none;padding:6px 0;font-weight:600}.tabbar a .fd-ic{width:22px;height:22px}.tabbar a.on{color:var(--fd-text)}
  .tabbar a.plus .fd-ic{background:var(--fd-accent);color:#fff;border-radius:12px;width:40px;height:30px;padding:4px 9px}
}
</style>
</head>
<body>
<div id="demo"></div>
<div class="shell">
  <aside class="side" aria-label="메뉴"><a href="#/" class="fd-logo" id="logo" aria-label="FORMDOT"></a>
  </aside>
  <main class="main" id="app"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="하단 메뉴"></nav>
<!--@@CORE_JS@@-->
<script>
const {$, $$, esc, won} = FD;
$("#demo").innerHTML = FD.demoBanner();
const NAV = [["", "홈", "home"], ["orders", "내 주문", "cube"], ["lookup", "주문 조회", "search"], ["portfolio", "사례", "bulb"], ["admin", "관리자", "wrench"]];
function chrome(name){
  const mine = FD.store.mine().filter(o => !["done","canceled"].includes(o.status)).length;
  $(".side").innerHTML = `<a href="#/" class="fd-logo" aria-label="FORMDOT">${FD.LOGO}${FD.WORD}</a><a href="#/new" class="new">＋ 새 견적</a>
    ${NAV.map(([k, t, ic]) => `<a href="#/${k}" class="${name === k ? "on" : ""}">${FD.icon(ic)}${t}${k === "orders" && mine ? `<span class="cnt">${mine}</span>` : ""}</a>`).join("")}
    <div class="bottom">${FD.kakao("오픈채팅 문의")}<p>로그인 없이 이 기기에서 주문한 내역을 보여 줘요. 다른 기기에서는 '주문 조회'로 확인해요.</p></div>`;
  $("#tabbar").innerHTML = [["", "홈", "home"], ["orders", "내 주문", "cube"], ["new", "새 견적", "upload"], ["lookup", "조회", "search"], ["portfolio", "사례", "bulb"]]
    .map(([k, t, ic]) => `<a href="#/${k}" class="${name === k ? "on" : ""}${k === "new" ? " plus" : ""}">${FD.icon(ic)}${t}</a>`).join("");
}
const orderCard = (o, full) => { const v = FD.publicView(o);
  return `<div class="oc"><div class="t"><b>#${o.no}</b> <span class="fd-st ${o.status}">${FD.stLabel(o.status)}</span><span>${esc(FD.svc(o.service)?.name)} · ${esc(o.title)}</span></div>
    <div class="acts">${o.status === "pay_wait" ? `<button class="fd-btn sm primary" data-pay="${o.no}">결제</button>` : ""}<button class="fd-btn sm" data-re="${o.no}">다시 주문</button></div>
    ${full ? FD.statusHTML(v).replace('<div class="fd-status">', '<div style="grid-column:1/-1">') : ""}</div>`; };

/* ---------- 홈 대시보드 ---------- */
let QQ = FD.session("print"), qv = null;
function home(){
  const mine = FD.store.mine(), active = mine.filter(o => !["done","canceled"].includes(o.status));
  const h = new Date().getHours();
  $("#app").innerHTML = `<div class="hd"><h1>${h < 12 ? "좋은 아침이에요" : h < 18 ? "안녕하세요" : "좋은 저녁이에요"} 👋</h1><div class="r"><a class="fd-btn sm" href="#/lookup">${FD.icon("search")}<span>주문 조회</span></a><a class="fd-btn sm primary" href="#/new">＋ <span>새 견적</span></a></div></div>
    <div class="grid">
      <section class="card c8"><h2>빠른 견적 <small>3D 파일을 놓으면 바로</small></h2><div class="qq">
        <div class="zone" tabindex="0" role="button" aria-label="3D 파일 놓기"><canvas></canvas><span class="zi">${FD.icon("upload")}<b style="display:block">파일 놓기</b><small>STL · 3MF · G-code</small><br><button type="button" class="fd-link" data-sample>샘플</button></span><input type="file" accept=".stl,.3mf,.gcode,.gco,.g" hidden></div>
        <div class="res"><div class="mini-opts"><select class="fd-in" id="qm" aria-label="재료">${FD.MATS.map(m => `<option value="${m.v}"${m.v === QQ.opts.mat ? " selected" : ""}>${m.name}</option>`).join("")}</select>
          <select class="fd-in" id="qc" aria-label="색상">${FD.COLORS.map(c => `<option value="${c.v}"${c.v === QQ.opts.color ? " selected" : ""}>${c.name}</option>`).join("")}</select>
          <select class="fd-in" id="qs" aria-label="튼튼함">${Object.entries(FD.QUICK_LABEL.strength).map(([k, t]) => `<option value="${k}"${k === QQ.opts.strength ? " selected" : ""}>튼튼함: ${t}</option>`).join("")}</select>
          <input class="fd-in" id="qn" type="number" min="1" max="999" value="${QQ.opts.qty}" aria-label="수량"></div>
          <div id="qmi" style="font-size:13px;color:var(--fd-muted)">${QQ.model ? FD.modelInfo(QQ.model) : "파일을 놓으면 크기와 금액이 바로 나와요."}</div>
          <div><small style="color:var(--fd-muted)">예상 견적</small><div class="big-price" id="qp">—</div><div id="qk"></div></div>
          <button class="fd-btn primary" id="qgo">이 설정으로 주문</button></div></div></section>
      <section class="card c4"><h2>진행 중 <small>${active.length}건</small></h2>${active.length ? `<div class="ord">${active.slice(0, 3).map(o => orderCard(o)).join("")}</div>${active.length > 3 ? `<a href="#/orders" class="fd-link">모두 보기</a>` : ""}`
        : `<div class="empty-hero"><b>진행 중인 주문이 없어요</b><p>이 기기에서 주문하면 여기에 바로 보여요.</p><a class="fd-btn sm" href="#/lookup">다른 기기 주문 조회</a></div>`}</section>
      <section class="card c12"><h2>새로 의뢰하기 <small>가진 것에 맞게</small></h2><div class="svc-tiles">${FD.SERVICES.map(s => `<button data-new="${s.id}">${FD.icon(s.ic)}<b>${s.q}</b><small>${s.id === "print" ? "자동 견적" : `디자인비 ${won(FD.settings.design[s.id])}~`}</small></button>`).join("")}</div></section>
      <section class="card c6"><h2>최근 완료 <small>다시 주문하면 설정 그대로</small></h2>${mine.filter(o => o.status === "done").slice(0, 3).map(o => orderCard(o)).join("") || '<p style="color:var(--fd-muted);margin:0">완료된 주문이 아직 없어요.</p>'}</section>
      <section class="card c6"><h2>알림 <small>사이트 안 알림 · 문자는 연동 후</small></h2><div class="feed">${feed(mine)}</div></section>
    </div>`;
  qv = new FD.Viewer($(".zone canvas"), {grid: "rgba(150,160,180,.15)"});
  if (QQ.model?.geo){ qv.setModel(QQ.model.geo); qv.setColor(QQ.opts.color); $(".zi").hidden = true; }
  FD.bindModelDrop($(".zone"), $(".zone input"), QQ, r => { if (r === "busy") return; $(".zi").hidden = !!QQ.model.geo; $("#qmi").innerHTML = FD.modelInfo(QQ.model); qq(); }, qv);
  const sync = () => { QQ.opts.mat = $("#qm").value; QQ.opts.color = $("#qc").value; QQ.opts.strength = $("#qs").value; QQ.opts.qty = Math.max(1, parseInt($("#qn").value) || 1); qv.setColor(QQ.opts.color); qq(); };
  ["qm","qc","qs","qn"].forEach(id => $("#" + id).addEventListener("change", sync));
  $("#qgo").onclick = () => { if (!QQ.model) return FD.toast("파일을 먼저 놓아 주세요"); NEW = QQ; QQ = FD.session("print"); location.hash = "#/new/print"; };
  qq();
}
function qq(){ const q = FD.calc(QQ); $("#qp").textContent = q.kind === "auto" ? won(q.total) : q.kind === "review" ? "확인 후 안내" : q.kind === "reject" ? "접수 불가" : "—";
  $("#qk").innerHTML = q.kind === "auto" ? '<span class="fd-badge ok">자동 견적</span>' : q.kind === "review" ? `<span class="fd-badge warn">추가 확인 필요</span> <small style="color:var(--fd-muted)">${esc(q.reasons[0])}</small>` : q.kind === "reject" ? `<small style="color:var(--fd-bad)">${esc(q.reasons[0])}</small>` : ""; }
function feed(mine){
  const L = FD.notify.log().filter(l => mine.some(o => o.no === l.no) && l.channel.includes("문자")).slice(0, 5);
  if (!L.length) return '<p style="color:var(--fd-muted);margin:0">새 소식이 없어요.</p>';
  const msg = e => e === "order_created" ? "주문이 접수됐어요" : e === "quote_confirmed" ? "견적이 확정됐어요" : e.startsWith("status_") ? `상태: ${FD.stLabel(e.slice(7))}` : e === "otp" ? "조회 인증번호 요청" : e;
  return L.map(l => `<div><time>${new Date(l.at).toLocaleDateString("ko-KR", {month: "numeric", day: "numeric"})} ${new Date(l.at).toLocaleTimeString("ko-KR", {hour: "2-digit", minute: "2-digit"})}</time><span>#${l.no} ${msg(l.event)}</span></div>`).join("");
}

/* ---------- 새 견적 (2단: 왼쪽 입력, 오른쪽 견적 고정) ---------- */
let NEW = null, nv = null;
function newOrder(svc){
  if (!NEW || (svc && NEW.svc !== svc)) NEW = FD.session(svc || "print");
  const st = NEW, isP = st.svc === "print";
  const flds = isP ? [] : [...FD.FLOWS[st.svc][0].fields, ...FD.FLOWS[st.svc][1].fields];
  $("#app").innerHTML = `<div class="hd"><h1>새 견적</h1></div>
    <div class="tabs" role="tablist">${FD.SERVICES.map(s => `<button role="tab" aria-selected="${s.id === st.svc}" class="${s.id === st.svc ? "on" : ""}" data-tab="${s.id}">${FD.icon(s.ic)}${s.name}</button>`).join("")}</div>
    <div class="form2"><div class="card">${isP ? `<div class="sub-h" style="margin-top:0">파일</div><label class="fd-drop" id="nz" tabindex="0">${FD.icon("upload")}<span><b>${st.model ? "다른 파일" : "파일 고르기"}</b><small>STL · 3MF · G-code</small></span><button type="button" class="fd-link" data-sample style="margin-left:auto">샘플</button><input type="file" accept=".stl,.3mf,.gcode,.gco,.g" hidden></label>
          <div id="nmi">${FD.modelInfo(st.model)}</div><div class="view"${st.model?.geo ? "" : " hidden"}><canvas></canvas></div><div class="sub-h">옵션</div><div id="npo"></div>`
        : `<form id="nf" novalidate>${FD.formHTML(flds, "f", st.values)}</form>`}
        <div class="sub-h">주문자</div><form id="nc" novalidate>${FD.formHTML(FD.CONTACT, "fc", st.contact || {})}</form>${FD.studentHTML("fc")}${FD.consentHTML("fc")}</div>
      <div class="stick"><div id="nq"></div><button class="fd-btn primary" id="ngo">주문 접수</button><button class="fd-btn ghost sm" id="ncp">견적 복사</button></div></div>`;
  $$("[data-tab]").forEach(b => b.onclick = () => location.hash = "#/new/" + b.dataset.tab);
  const upd = () => { if (!isP) Object.assign(st.values, FD.readForm($("#nf"), flds, "f")); st.quote = FD.calc(st); $("#nq").innerHTML = FD.quoteHTML(st.quote, {emptyText: isP ? "파일을 올리면 계산돼요." : "형태 난이도·수정 범위를 고르면 계산돼요."}); };
  if (isP){ nv = new FD.Viewer($(".view canvas")); if (st.model?.geo){ nv.setModel(st.model.geo); nv.setColor(st.opts.color); }
    FD.bindModelDrop($("#nz"), $("#nz input"), st, r => { if (r === "busy") return; $("#nmi").innerHTML = FD.modelInfo(st.model); $(".view").hidden = !st.model.geo; nv.draw(); upd(); }, nv);
    $("#nz").addEventListener("click", e => { if (e.target.closest("[data-sample]")) e.preventDefault(); });
    FD.mountPrintOptions($("#npo"), st, () => { nv.setColor(st.opts.color); upd(); }); }
  else FD.bindForm($("#nf"), upd);
  FD.bindForm($("#nc")); FD.bindStudent("fc", on => { st.student = on; upd(); });
  $("#ncp").onclick = () => FD.copy(FD.quoteText(st.svc, FD.titleOf(st), FD.calc(st)));
  $("#ngo").onclick = () => {
    if (isP){ if (!st.model) return FD.toast("파일을 올려 주세요"); if (FD.calc(st).kind === "reject") return FD.toast("이 파일은 접수할 수 없어요"); }
    else { const v = FD.validate($("#nf"), flds, "f"); if (!v) return; Object.assign(st.values, v); }
    const c = FD.validate($("#nc"), FD.CONTACT, "fc"); if (!c || !FD.checkConsent("fc")) return;
    st.quote = FD.calc(st); const o = FD.finish(st, c); NEW = null; location.hash = "#/done/" + o.no;
  };
  upd();
}
function reorder(no){
  const o = FD.store.get(no); if (!o) return;
  NEW = FD.session(o.service);
  if (o.service === "print"){ if (o.opts) Object.assign(NEW.opts, o.opts); FD.toast("설정을 불러왔어요. 파일만 다시 올려 주세요."); }
  else { Object.assign(NEW.values, o.values || {}); FD.toast("이전 내용을 불러왔어요. 첨부 파일은 다시 올려 주세요."); }
  location.hash = "#/new/" + o.service;
}
function route(){
  const [, name = "", arg] = location.hash.split("/");
  chrome(name); window.scrollTo(0, 0);
  if (name === "new") return newOrder(arg);
  if (name === "orders"){ const mine = FD.store.mine(); $("#app").innerHTML = `<div class="hd"><h1>내 주문</h1></div>${mine.length ? `<div class="ord">${mine.map(o => orderCard(o, true)).join("")}</div>` : `<div class="card empty-hero"><b>이 기기에서 한 주문이 없어요</b><p>다른 기기에서 주문했다면 주문번호와 휴대폰 인증으로 확인할 수 있어요.</p><a class="fd-btn primary" href="#/lookup">주문 조회</a></div>`}`; return; }
  if (name === "lookup"){ $("#app").innerHTML = `<div class="hd"><h1>주문 조회</h1></div><div class="card" style="max-width:520px"><div id="lk"></div></div>`; return FD.mountLookup($("#lk")); }
  if (name === "portfolio"){ $("#app").innerHTML = `<div class="hd"><h1>사례</h1></div><div class="pf-grid">${FD.PORTFOLIO.map(p => `<button class="pf" data-new="${p.svc}"><img src="${p.img}" alt=""><div><b>${esc(p.t)}</b><small>${esc(p.d)} · ${FD.SAMPLE_TAG}</small></div></button>`).join("")}</div>`; return; }
  if (name === "admin"){ $("#app").innerHTML = `<div id="adm"></div>`; return FD.mountAdmin($("#adm"), {onSettings: () => {}}); }
  if (name === "done"){ const o = FD.store.get(arg); $("#app").innerHTML = `<div class="card" style="max-width:560px;margin:0 auto">${o ? FD.doneHTML(o) : "주문을 찾을 수 없어요."}<div style="display:flex;gap:8px;justify-content:center;margin-top:16px"><a class="fd-btn" href="#/orders">내 주문</a><a class="fd-btn ghost" href="#/">홈</a></div></div>`; return; }
  home();
}
document.addEventListener("click", e => {
  const n = e.target.closest("[data-new]"); if (n){ location.hash = "#/new/" + n.dataset.new; return; }
  const r = e.target.closest("[data-re]"); if (r){ reorder(r.dataset.re); return; }
  const p = e.target.closest("[data-pay]"); if (p){ FD.settings.smartstoreUrl ? open(FD.settings.smartstoreUrl, "_blank", "noopener") : FD.toast("스마트스토어 링크가 아직 설정되지 않았어요 (관리자 › 설정)"); }
});
addEventListener("hashchange", route); route();
</script>
</body>
