<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORMDOT · E 에디토리얼 포트폴리오</title>
<meta name="theme-color" content="#f3f0ea">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<!--@@CORE_CSS@@-->
<style>
/* ===== E · Editorial Portfolio — 따뜻한 종이색, 세리프 제목, 사례 이야기가 주문으로 이어짐 ===== */
:root{--fd-bg:#f3f0ea;--fd-surface:#fbfaf7;--fd-surface2:#fff;--fd-line:#ddd6ca;--fd-text:#1e1d1b;--fd-muted:#6f6a61;--fd-accent:#2257f5;--fd-accent-text:#1b47cc;
  --fd-accent-soft:#e8eefe;--fd-warn:#a86a12;--fd-warn-soft:#fbf1df;--fd-ok:#1f7a45;--fd-bad:#c4352b;--fd-r:4px;--fd-r-sm:4px;--serif:"Noto Serif KR",Georgia,serif}
body{margin:0;background:var(--fd-bg);color:var(--fd-text);font-family:var(--fd-font);-webkit-font-smoothing:antialiased}
.fd-logo-sym{color:#202124}.fd-toast{background:#1e1d1b;color:#fff}
.serif{font-family:var(--serif)}
.mast{border-bottom:1px solid var(--fd-text);max-width:1200px;margin:0 auto;padding:18px 24px 14px;display:flex;align-items:flex-end;gap:16px}
.mast .fd-logo{font-size:15px;color:#202124;text-decoration:none}.mast .issue{font:500 12px var(--fd-font);letter-spacing:.14em;color:var(--fd-muted)}
.mast nav{margin-left:auto;display:flex;gap:20px}.mast nav a{color:var(--fd-text);text-decoration:none;font-weight:600;font-size:14px}.mast nav a.on{text-decoration:underline;text-underline-offset:5px}
.mast .order{margin-left:6px;background:var(--fd-text);color:#fff;border:0;border-radius:99px;padding:9px 16px;font:700 13.5px var(--fd-font);cursor:pointer}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.cover{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;padding:48px 0 56px;border-bottom:1px solid var(--fd-line)}
.cover figure{margin:0}.cover img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.cover figcaption{font-size:12px;color:var(--fd-muted);margin-top:8px}
.kicker{font:700 12px var(--fd-font);letter-spacing:.18em;color:var(--fd-accent)}
.cover h1{font:900 clamp(36px,5vw,64px)/1.12 var(--serif);letter-spacing:-.03em;margin:14px 0 18px}
.cover p{font-size:17.5px;line-height:1.8;color:#3d3a35;margin:0 0 26px}
.btn-ink{display:inline-flex;align-items:center;gap:10px;background:var(--fd-text);color:#fff;border:0;border-radius:99px;padding:15px 24px;font:700 15px var(--fd-font);cursor:pointer;text-decoration:none}
.btn-ink .fd-ic{width:18px;height:18px}
.link-u{color:var(--fd-text);font-weight:600;text-underline-offset:4px;margin-left:16px}
.issue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:1px solid var(--fd-line)}
.issue-grid article{padding:34px 26px 34px 0;border-right:1px solid var(--fd-line);cursor:pointer}.issue-grid article+article{padding-left:26px}.issue-grid article:last-child{border-right:0}
.issue-grid img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;margin-bottom:16px}
.issue-grid h3{font:700 22px/1.3 var(--serif);margin:8px 0}.issue-grid p{color:var(--fd-muted);line-height:1.7;margin:0 0 12px;font-size:14.5px}
.issue-grid .more{font-weight:700;font-size:13.5px;color:var(--fd-accent)}
.chap{display:grid;grid-template-columns:260px 1fr;gap:40px;padding:56px 0;border-bottom:1px solid var(--fd-line)}
.chap h2{font:900 30px/1.25 var(--serif);margin:0}
.chap .svc{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:2px solid var(--fd-text)}
.chap .svc button{text-align:left;padding:18px 16px 22px 0;background:none;border:0;border-right:1px solid var(--fd-line);font:inherit;color:inherit;cursor:pointer}
.chap .svc button+button{padding-left:16px}.chap .svc button:last-child{border-right:0}
.chap .svc b{display:block;font:700 18px var(--serif);margin:10px 0 6px}.chap .svc small{color:var(--fd-muted);line-height:1.6;display:block}.chap .svc em{font-style:normal;font-size:12.5px;color:var(--fd-accent);font-weight:700;display:block;margin-top:10px}
.chap .svc .n{font:700 12px var(--fd-font);color:var(--fd-muted)}
.chap .svc button:hover b{text-decoration:underline}
.quote-blk{font:500 24px/1.6 var(--serif);max-width:820px}
.quote-blk small{display:block;font:14px var(--fd-font);color:var(--fd-muted);margin-top:14px}
/* 사례 상세 (이야기) */
.story{max-width:760px;margin:0 auto;padding:40px 24px 120px}
.story h1{font:900 clamp(32px,5vw,52px)/1.18 var(--serif);letter-spacing:-.02em;margin:12px 0 18px}
.story .lede{font-size:19px;line-height:1.8;color:#3d3a35}
.story img{width:100%;display:block;margin:28px 0 8px}
.story .cap{font-size:12px;color:var(--fd-muted)}
.timeline{border-left:2px solid var(--fd-text);margin:34px 0;padding-left:24px}
.timeline div{position:relative;margin-bottom:26px}.timeline div::before{content:"";position:absolute;left:-31px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--fd-bg);border:2px solid var(--fd-text)}
.timeline b{font:700 18px var(--serif)}.timeline p{margin:6px 0 0;color:#3d3a35;line-height:1.7}
.story .ask{background:var(--fd-text);color:#fff;padding:28px;margin-top:40px}
.story .ask h3{font:700 24px var(--serif);margin:0 0 8px}.story .ask p{color:#d8d3ca;margin:0 0 18px}.story .ask .btn-ink{background:#fff;color:var(--fd-text)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:24px 0}
.filters button{border:1px solid var(--fd-text);background:transparent;border-radius:99px;padding:7px 14px;font:600 13.5px var(--fd-font);cursor:pointer;color:var(--fd-text)}.filters button.on{background:var(--fd-text);color:#fff}
.idx{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.idx article{cursor:pointer}.idx img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.idx h3{font:700 20px var(--serif);margin:12px 0 4px}.idx p{color:var(--fd-muted);margin:0;font-size:14px}
/* 의뢰 서랍 */
.drawer{position:fixed;inset:0;z-index:50;background:rgba(30,29,27,.45);display:flex;justify-content:flex-end}
.drawer .in{width:min(520px,100%);height:100%;background:var(--fd-bg);display:flex;flex-direction:column;animation:dr .35s cubic-bezier(.2,.8,.2,1)}
@keyframes dr{from{transform:translateX(50px);opacity:0}to{transform:none;opacity:1}}
.drawer .hd{padding:18px 22px;border-bottom:1px solid var(--fd-text);display:flex;align-items:center;gap:10px}.drawer .hd b{font:700 20px var(--serif)}.drawer .hd button{margin-left:auto}
.drawer .steps{display:flex;gap:0;border-bottom:1px solid var(--fd-line);font-size:12.5px}
.drawer .steps span{flex:1;padding:10px 0;text-align:center;color:var(--fd-muted);border-bottom:2px solid transparent}.drawer .steps span.on{color:var(--fd-text);border-color:var(--fd-text);font-weight:700}
.drawer .bd{flex:1;overflow:auto;padding:22px}
.drawer .ft{display:flex;gap:8px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--fd-line)}.drawer .ft .btn-ink{flex:1;justify-content:center}
.drawer .ctx{background:var(--fd-surface);border:1px solid var(--fd-line);padding:12px 14px;font-size:13.5px;margin-bottom:18px;display:flex;gap:12px;align-items:center}
.drawer .ctx img{width:64px;height:48px;object-fit:cover}
.view{height:240px;position:relative;background:#fff;border:1px solid var(--fd-line);margin-top:12px}.view canvas{position:absolute;inset:0;width:100%;height:100%}
.fd-quote{background:#fff;border-color:var(--fd-line)}.fd-quote.review{background:#fffaf0}
.fd-status,.fd-odetail,.fd-kpi,.fd-orow,.fd-set,.fd-chan-i{background:#fff}
.page{max-width:560px;margin:0 auto;padding:40px 24px 90px}.page h1{font:900 34px var(--serif)}
.page.wide{max-width:1200px}
footer{border-top:1px solid var(--fd-text);max-width:1200px;margin:40px auto 0;padding:20px 24px 60px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--fd-muted)}
@media (max-width:860px){
  .mast{padding:12px 16px;flex-wrap:wrap}.mast .issue{display:none}.mast nav{gap:14px;order:3;width:100%;overflow-x:auto}.mast nav a{font-size:13.5px;white-space:nowrap}
  .mast .order{margin-left:auto}
  .wrap{padding:0 16px}
  .cover{grid-template-columns:1fr;gap:20px;padding:24px 0 32px}.cover p{font-size:16px}
  .issue-grid{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:80%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .issue-grid article{scroll-snap-align:start;padding:24px 16px 24px 0!important;border-right:1px solid var(--fd-line)}
  .chap{grid-template-columns:1fr;gap:16px;padding:36px 0}
  .chap .svc{grid-template-columns:1fr}.chap .svc button{border-right:0;border-bottom:1px solid var(--fd-line);padding:14px 0!important;display:grid;grid-template-columns:28px 1fr;column-gap:8px}
  .chap .svc .n{grid-row:1/4}.chap .svc b{margin:0 0 2px;font-size:17px}.chap .svc small{font-size:13px}.chap .svc em{margin-top:4px}
  .quote-blk{font-size:19px}
  .idx{grid-template-columns:1fr 1fr;gap:16px}.idx h3{font-size:16px}
  .story{padding:24px 16px 80px}.story .lede{font-size:16.5px}
}
</style>
</head>
<body>
<div id="demo"></div>
<header class="mast"><a href="#/" class="fd-logo" aria-label="FORMDOT" id="logo"></a><span class="issue">MAKING STORIES · 제작 이야기</span>
  <nav><a href="#/stories">사례</a><a href="#/services">의뢰 방식</a><a href="#/lookup">주문 조회</a><a href="#/admin">관리자</a></nav><button class="order" data-ask="">의뢰하기</button></header>
<main id="app"></main>
<footer><span>FORMDOT · 형태의 시작, 상상을 현실로.</span><span id="fk"></span></footer>
<div id="drawer"></div>
<!--@@CORE_JS@@-->
<script>
const {$, $$, esc, won} = FD;
$("#demo").innerHTML = FD.demoBanner(); $("#logo").innerHTML = FD.LOGO + FD.WORD; $("#fk").innerHTML = FD.kakao("오픈채팅 문의");
// 사례마다 '이야기' (샘플 시나리오 — 실제 고객 사례 아님)
const STORY = {
  "수건걸이 겸 수세미 거치대": ["욕실 타일 폭에 딱 맞게", "한 줄 설명과 사진 한 장으로 시작했어요.", [["의뢰", "‘싱크대 옆 벽에 수건도 걸고 수세미도 올리고 싶어요’라는 한 줄."],["설계", "물이 빠지는 구멍과 양면테이프 면적을 넣어 2시간 안에 설계."],["출력", "물에 강한 PETG HF로 출력."],["전달", "스마트스토어 결제 후 이틀 만에 발송."]]],
  "핑거보드 레일 · 계단": ["취미 트랙을 원하는 높이로", "손그림의 치수만 보고 세트로 만들었어요.", [["의뢰", "종이에 그린 계단 높이·폭 스케치."],["설계", "조립식으로 나눠 출력 범위 안에 맞춤."],["출력", "PLA Basic, 튼튼하게 설정."],["전달", "부품별로 포장해 발송."]]],
  "선반 받침 브래킷": ["2kg 화분을 버티는 L자", "스케치 한 장에서 시작한 기능성 부품.", [["의뢰", "L자 모양과 나사 구멍 위치가 적힌 스케치."],["설계", "힘 받는 모서리에 보강 리브 추가."],["출력", "단단한 PLA-CF, 벽 4겹."],["전달", "나사 규격 안내와 함께 발송."]]],
  "케이블 정리 클립": ["책상 두께에 맞춘 끼움형", "정확한 치수가 중요한 전문 모델링.", [["의뢰", "책상 두께 18mm, 케이블 3가닥."],["설계", "끼움 공차를 맞춰 시험 출력 1회."],["출력", "PETG HF."],["전달", "여분 1개 포함."]]],
  "센서 하우징 2파트": ["보드가 딱 들어가는 케이스", "부품 치수를 받아 2파트로 설계.", [["의뢰", "보드 40×30mm, 커넥터 위치 도면."],["설계", "±0.1mm 정밀 공차, 끼움 방식."],["출력", "실외용 ASA."],["전달", "STEP 파일도 함께 전달."]]],
  "피규어 받침대": ["이름을 새긴 받침대", "가진 3D 파일에 각인만 더했어요.", [["의뢰", "기존 STL에 이름 각인 요청."],["수정", "글자 높이 0.6mm로 각인 추가."],["출력", "광택 PLA Silk+."],["전달", "선물 포장 문의는 오픈채팅으로."]]]
};
const stories = FD.PORTFOLIO.map((p, i) => ({...p, i, s: STORY[p.t]}));
const svcPrice = id => id === "print" ? "디자인비 없음 · 자동 견적" : `디자인비 ${won(FD.settings.design[id])}부터`;
function home(){
  const c = stories[1];
  $("#app").innerHTML = `<div class="wrap">
    <section class="cover"><figure><img src="${c.img}" alt=""><figcaption>${FD.SAMPLE_TAG} · ${esc(c.t)}</figcaption></figure>
      <div><div class="kicker">이번 호의 이야기</div><h1>손그림 한 장이<br>물건이 되기까지</h1>
        <p>FORMDOT은 3D 파일이 없어도 시작할 수 있는 제작 스튜디오예요. 그림, 사진, 한 줄 설명을 보내 주시면 설계와 출력까지 맡아요. 대부분의 견적은 바로 나와요.</p>
        <button class="btn-ink" data-story="${c.i}">이야기 읽기 ${FD.icon("arrow")}</button><a class="link-u" href="#" data-ask="">바로 의뢰하기</a></div></section>
    <section class="issue-grid">${stories.slice(2, 5).map(s => `<article data-story="${s.i}"><img src="${s.img}" alt=""><div class="kicker">${FD.svc(s.svc).name}</div><h3>${esc(s.s[0])}</h3><p>${esc(s.s[1])}</p><span class="more">읽어보기 →</span></article>`).join("")}</section>
    <section class="chap" id="services"><h2>가진 것에서<br>시작하세요</h2><div class="svc">${FD.SERVICES.map((s, i) => `<button data-ask="${s.id}"><span class="n">0${i + 1}</span><b>${s.q}</b><small>${s.d}</small><em>${svcPrice(s.id)}</em></button>`).join("")}</div></section>
    <section class="chap"><h2>견적에 대한<br>약속</h2><div class="quote-blk">“대부분은 올리는 순간 금액이 나옵니다. 확인이 꼭 필요할 때만 사람이 보고, 그 이유를 말씀드려요.”<small>결제는 네이버 스마트스토어 · 주문 조회는 주문번호와 휴대폰 인증</small></div></section></div>`;
}
function storyPage(i){
  const s = stories[+i]; if (!s) return home();
  $("#app").innerHTML = `<article class="story"><div class="kicker">${FD.svc(s.svc).name} · 사례</div><h1>${esc(s.s[0])}</h1><p class="lede">${esc(s.s[1])}</p>
    <img src="${s.img}" alt=""><div class="cap">${FD.SAMPLE_TAG} — 실제 고객 사례가 아닌, 서비스 흐름을 보여 주는 예시 이야기예요.</div>
    <div class="timeline">${s.s[2].map(([b, p]) => `<div><b>${b}</b><p>${esc(p)}</p></div>`).join("")}</div>
    <div class="ask"><h3>비슷한 것을 만들고 싶나요?</h3><p>${FD.svc(s.svc).q} — ${FD.svc(s.svc).d}</p><button class="btn-ink" data-ask="${s.svc}" data-from="${s.i}">이 방식으로 의뢰하기 ${FD.icon("arrow")}</button></div></article>`;
}
let flt = "all";
function index(){
  $("#app").innerHTML = `<div class="wrap" style="padding-top:30px;padding-bottom:40px"><div class="kicker">ARCHIVE</div><h1 class="serif" style="font-size:40px;margin:8px 0 0">제작 사례</h1>
    <div class="filters">${[["all","전체"], ...FD.SERVICES.map(s => [s.id, s.name])].map(([k, t]) => `<button class="${flt === k ? "on" : ""}" data-f="${k}">${t}</button>`).join("")}</div>
    <div class="idx">${stories.filter(s => flt === "all" || s.svc === flt).map(s => `<article data-story="${s.i}"><img src="${s.img}" alt=""><h3>${esc(s.t)}</h3><p>${esc(s.d)} · ${FD.SAMPLE_TAG}</p></article>`).join("") || '<p class="fd-empty">해당 사례가 아직 없어요.</p>'}</div></div>`;
  $$("[data-f]").forEach(b => b.onclick = () => { flt = b.dataset.f; index(); });
}

/* ---------- 의뢰 서랍: 방식 → 자료 → 견적 → 연락처 ---------- */
let D = null;
function openAsk(svc, from){ D = {st: FD.session(svc || "print"), i: svc ? 1 : 0, from: from != null ? stories[+from] : null}; drawAsk(); }
function drawAsk(){
  const st = D.st, isP = st.svc === "print", names = ["의뢰 방식", "자료와 요구사항", "견적", "연락처"];
  st.quote = FD.calc(st);
  let body = "";
  if (D.i === 0) body = `<div class="fd-radios">${FD.SERVICES.map(s => `<button class="fd-opt${s.id === st.svc ? " on" : ""}" data-svc="${s.id}"><b>${s.q}</b><small>${s.name} · ${svcPrice(s.id)}</small></button>`).join("")}</div>`;
  else if (D.i === 1) body = isP ? `<label class="fd-drop" id="dz" tabindex="0">${FD.icon("upload")}<span><b>3D 파일 올리기</b><small>STL · 3MF · G-code</small></span><button type="button" class="fd-link" data-sample style="margin-left:auto">샘플</button><input type="file" accept=".stl,.3mf,.gcode,.gco,.g" hidden></label><div id="mi">${FD.modelInfo(st.model)}</div><div class="view"${st.model?.geo ? "" : " hidden"}><canvas></canvas></div><div id="po" style="margin-top:16px"></div>`
      : `<form id="fa" novalidate>${FD.formHTML([...FD.FLOWS[st.svc][0].fields, ...FD.FLOWS[st.svc][1].fields], "e", st.values)}</form>`;
  else if (D.i === 2) body = FD.quoteHTML(st.quote) + `<p style="font-size:13.5px;color:var(--fd-muted);margin-top:14px">${esc(FD.titleOf(st))}</p><button class="fd-btn ghost sm" id="cp">견적 복사</button>`;
  else body = `<form id="fc" novalidate>${FD.formHTML(FD.CONTACT, "ec")}</form>${FD.studentHTML("ec")}${FD.consentHTML("ec")}`;
  $("#drawer").innerHTML = `<div class="drawer" role="dialog" aria-modal="true" aria-label="의뢰하기"><div class="in">
    <div class="hd"><b>의뢰하기</b><span class="fd-badge">${FD.svc(st.svc).name}</span><button class="fd-btn ghost sm" id="dx" aria-label="닫기">✕</button></div>
    <div class="steps">${names.map((n, i) => `<span class="${i === D.i ? "on" : ""}">${i + 1}. ${n}</span>`).join("")}</div>
    <div class="bd">${D.from ? `<div class="ctx"><img src="${D.from.img}" alt=""><span>‘${esc(D.from.t)}’ 같은 의뢰로 시작했어요.</span></div>` : ""}${body}</div>
    <div class="ft">${D.i ? '<button class="fd-btn ghost" id="pv">이전</button>' : ""}<button class="btn-ink" id="nx">${D.i === 3 ? "의뢰 접수하기" : D.i === 2 ? (st.quote.kind === "review" ? "확인 요청으로 진행" : "이 금액으로 진행") : "다음"}</button></div></div></div>`;
  $("#dx").onclick = () => $("#drawer").innerHTML = ""; $(".drawer").onclick = e => { if (e.target.classList.contains("drawer")) $("#drawer").innerHTML = ""; };
  if ($("#pv")) $("#pv").onclick = () => { D.i--; drawAsk(); };
  if (D.i === 0) $$("[data-svc]").forEach(b => b.onclick = () => { if (b.dataset.svc !== st.svc) D.st = FD.session(b.dataset.svc); D.i = 1; drawAsk(); });
  if (D.i === 1 && isP){ const v = new FD.Viewer($(".view canvas")); if (st.model?.geo){ v.setModel(st.model.geo); v.setColor(st.opts.color); }
    FD.bindModelDrop($("#dz"), $("#dz input"), st, r => { if (r === "busy") return; $("#mi").innerHTML = FD.modelInfo(st.model); $(".view").hidden = !st.model.geo; v.draw(); }, v);
    $("#dz").addEventListener("click", e => { if (e.target.closest("[data-sample]")) e.preventDefault(); });
    FD.mountPrintOptions($("#po"), st, () => v.setColor(st.opts.color)); }
  if (D.i === 1 && !isP) FD.bindForm($("#fa"));
  if (D.i === 2) $("#cp").onclick = () => FD.copy(FD.quoteText(st.svc, FD.titleOf(st), st.quote));
  if (D.i === 3){ FD.bindForm($("#fc")); FD.bindStudent("ec", on => st.student = on); }
  $("#nx").onclick = () => {
    if (D.i === 1){ if (isP){ if (!st.model) return FD.toast("파일을 올려 주세요"); if (FD.calc(st).kind === "reject") return FD.toast("이 파일은 접수할 수 없어요"); }
      else { const all = [...FD.FLOWS[st.svc][0].fields, ...FD.FLOWS[st.svc][1].fields]; const v = FD.validate($("#fa"), all, "e"); if (!v) return; Object.assign(st.values, v); } }
    if (D.i === 3){ const c = FD.validate($("#fc"), FD.CONTACT, "ec"); if (!c || !FD.checkConsent("ec")) return; st.quote = FD.calc(st); const o = FD.finish(st, c); $("#drawer").innerHTML = ""; D = null; location.hash = "#/done/" + o.no; return; }
    D.i++; drawAsk(); $(".drawer .bd").scrollTop = 0;
  };
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-ask]"); if (a){ e.preventDefault(); return openAsk(a.dataset.ask, a.dataset.from); }
  const s = e.target.closest("[data-story]"); if (s){ location.hash = "#/story/" + s.dataset.story; }
});
function route(){
  const [, name = "", arg] = location.hash.split("/");
  $$(".mast nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#/" + name));
  window.scrollTo(0, 0);
  if (name === "story") return storyPage(arg);
  if (name === "stories") return index();
  if (name === "lookup"){ $("#app").innerHTML = `<div class="page"><div class="kicker">ORDER</div><h1>주문 조회</h1><p style="color:var(--fd-muted)">주문번호와 휴대폰 번호로 인증해요.</p><div id="lk"></div></div>`; return FD.mountLookup($("#lk")); }
  if (name === "admin"){ $("#app").innerHTML = `<div class="page wide"><div id="adm"></div></div>`; return FD.mountAdmin($("#adm")); }
  if (name === "done"){ const o = FD.store.get(arg); $("#app").innerHTML = `<div class="page">${o ? FD.doneHTML(o) : "주문을 찾을 수 없어요."}<div style="display:flex;gap:8px;justify-content:center;margin-top:18px"><a class="fd-btn" href="#/lookup">주문 조회</a><a class="fd-btn ghost" href="#/stories">사례 더 보기</a></div></div>`; return; }
  home(); if (name === "services") document.getElementById("services").scrollIntoView();
}
addEventListener("hashchange", route); route();
</script>
</body>
</html>
