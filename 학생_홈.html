<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 홈</title>
<style>
  :root{
    /* 포인트 색상: 이 값만 바꾸면 전체 화면의 파란색이 한 번에 바뀝니다 */
    --point-strong:#3F6FF5;  /* 진한 포인트컬러 */
    --point-light:#E6ECFF;   /* 연한 포인트컬러 */
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:#ffffff;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;
    justify-content:center;
  }

  .screen{
    width:100%;
    max-width:480px;
    padding:24px 20px;
  }

  /* 1,3,4: 상단 인사말 + 알림/설정 버튼 */
  .top-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .greeting{
    font-size:24px;
    font-weight:800;
    color:#111111;
  }

  .greeting .user-name{
    color:var(--point-strong);
  }

  .greeting .page-label{
    color:#9aa0a6;
    font-weight:700;
    margin-right:6px;
  }

  .top-icons{
    display:flex;
    gap:14px;
  }

  .icon-btn{
    width:36px;
    height:36px;
    border:none;
    background:none;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--point-strong);
  }

  /* 5,6: 제출해야 할 숙제 카드 (얇게 압축) */
  .homework-card{
    margin-top:20px;
    background:var(--point-strong);
    border-radius:24px;
    padding:18px 20px;
  }

  .homework-title{
    color:#ffffff;
    font-size:22px;
    font-weight:800;
    margin:0 0 4px 0;
  }

  .homework-date-range{
    color:#ffffff;
    font-size:15px;
    opacity:0.9;
    margin:0 0 14px 0;
  }

  .homework-item{
    background:#ffffff;
    border-radius:18px;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }

  .subject-badge{
    display:inline-block;
    background:var(--point-light);
    color:var(--point-strong);
    font-size:12px;
    font-weight:800;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:8px;
  }

  .hw-name{
    font-size:18px;
    font-weight:800;
    color:#111111;
    margin:0 0 4px;
  }

  .hw-due{
    font-size:12px;
    color:#888888;
    margin:0;
  }

  .hw-right{
    display:flex;
    align-items:center;
    gap:4px;
    flex-shrink:0;
  }

  .hw-dday{
    background:var(--point-light);
    color:var(--point-strong);
    font-weight:800;
    font-size:14px;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
  }

  .hw-arrow{
    color:#c2c2c2;
    display:flex;
  }

  .more-link{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed rgba(255,255,255,0.5);
    text-align:center;
    color:#ffffff;
    font-weight:700;
    font-size:15px;
  }

  /* 7: 아래는 나중에 채울 빈 공백 */
  .blank-section{
    background:#ffffff;
    min-height:200px;
  }

  /* 하단 고정 메뉴 (화면이 바뀌어도 계속 유지) */
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:#ffffff;
    border-top:1px solid #eeeeee;
    display:flex;
    z-index:50;
  }

  .nav-item{
    flex:1;
    background:none;
    border:none;
    padding:10px 0 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:#9aa0a6;
    font-size:11px;
    font-weight:700;
    letter-spacing:-0.3px;
    cursor:pointer;
  }

  .nav-item.active{
    color:var(--point-strong);
  }

  /* 하단 고정 메뉴에 콘텐츠가 가려지지 않도록 여백 확보 */
  .screen{
    padding-bottom:90px;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="top-bar">
    <div class="greeting"><span class="page-label">홈|</span><span class="user-name">(이름)</span>님 안녕하세요!</div>

    <div class="top-icons">
      <button class="icon-btn" aria-label="알림">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="homework-card">
    <p class="homework-title">제출해야 할 숙제</p>
    <p class="homework-date-range">8월 25일 ~ 8월 25일 숙제</p>

    <div class="homework-item">
      <div>
        <span class="subject-badge">독해</span>
        <p class="hw-name">백지T 연습</p>
        <p class="hw-due">제출 기한: 8월 25일</p>
      </div>
      <div class="hw-right">
        <span class="hw-dday">D-1일</span>
        <span class="hw-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"></path>
          </svg>
        </span>
      </div>
    </div>

    <div class="more-link">외 0건의 숙제 &gt;</div>
  </div>

  <div class="blank-section"></div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-8 9 8"></path>
      <path d="M5 10v10h14V10"></path>
    </svg>
    <span>홈</span>
  </button>

  <button class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6h11M9 12h11M9 18h11"></path>
      <path d="M4 6h.01M4 12h.01M4 18h.01"></path>
    </svg>
    <span>숙제 목록</span>
  </button>

  <button class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"></rect>
      <path d="M16 2v4M8 2v4M3 10h18"></path>
    </svg>
    <span>달력</span>
  </button>

  <button class="nav-item">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
    </svg>
    <span>마이페이지</span>
  </button>
</nav>

</body>
</html>
